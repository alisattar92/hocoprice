<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>hoco. Elite Ultra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAqqQ9j34XDw1_CvfWfuX_VTM66Y6C1C0SRHYJ", 
            authDomain: "hocoprice.firebaseapp.com",
            projectId: "hocoprice",
            storageBucket: "hocoprice.firebasestorage.app",
            messagingSenderId: "367105764415",
            appId: "1:367105764415:web:c2e2d7cb06fa489114757c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.dbCol = collection(db, "products");
        window.dbAds = collection(db, "ads");
        window.dbDirect = db;
    </script>

    <style>
        :root { --primary: #0f172a; --maroon: #800000; --bg: #f1f5f9; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--primary); overflow-x: hidden; }

        @keyframes revealUp { from { opacity: 0; transform: translateY(40px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .reveal { animation: revealUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        @keyframes fadeOut { 0% { opacity: 1; visibility: visible; } 80% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
        .welcome-overlay { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); text-align: center; }
        .show-welcome { display: flex; animation: fadeOut 4s forwards; }

        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .glass-dark { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }

        .product-card { background: white; border-radius: 28px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; border: 1px solid rgba(0,0,0,0.03); }
        .admin-only { display: none !important; }
        .is-admin .admin-only { display: flex !important; }
        
        #imageOverlay { display: none; position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; backdrop-filter: blur(20px); }
        #imageOverlay img { max-width: 90%; max-height: 80%; border-radius: 20px; }

        .category-header { background: #e2e8f0; color: #475569; padding: 10px 24px; border-radius: 16px; font-size: 14px; font-weight: 900; margin: 30px 0 15px 0; display: inline-block; }
        .ads-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .ad-item { border-radius: 22px; overflow: hidden; aspect-ratio: 16/9; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); position: relative; }
        .ad-item img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body class="pb-40">

    <div id="welcomeMsg" class="welcome-overlay">
        <div class="reveal">
            <div class="text-6xl mb-4">🇮🇶</div>
            <h2 class="text-white text-2xl font-black mb-2">أهلاً بك في hoco. Iraq</h2>
            <p class="text-slate-300 text-sm leading-relaxed">كل تفصيله بهالنظام معمولة بحب حتى تختصر عليكم الوقت والتعب ..<br><span class="text-amber-400 font-bold mt-2 block">فريق مبيعات Hoco Iraq 🇮🇶</span></p>
        </div>
    </div>

    <div id="imageOverlay" onclick="this.style.display='none'">
        <img id="fullImg" src="">
    </div>

    <div id="loginScreen" class="fixed inset-0 z-[100] bg-[#0f172a] flex flex-col items-center justify-center p-8">
        <h1 class="text-6xl font-black text-white italic mb-10 tracking-tighter reveal">hoco.</h1>
        <div class="w-full max-w-xs space-y-4 reveal">
            <input type="password" id="passInput" placeholder="الرمز السري" class="w-full p-6 rounded-[2rem] text-center text-xl font-bold bg-white/5 border border-white/10 text-white outline-none">
            <button onclick="checkLogin()" class="w-full bg-white text-[#0f172a] py-6 rounded-[2rem] font-black shadow-2xl active:scale-95 transition-all">دخول للنظام</button>
        </div>
    </div>

    <div id="mainContent" class="hidden">
        <header class="glass sticky top-0 z-50 p-4 flex justify-between items-center px-6">
            <div class="w-20"><button id="adminBtn" onclick="document.getElementById('adminUI').classList.toggle('hidden')" class="admin-only bg-slate-200 text-slate-800 p-2 rounded-xl text-[10px] font-bold">إدارة</button></div>
            <h1 class="text-2xl font-black italic tracking-tighter">hoco.</h1>
            <div class="w-20 text-left"><button onclick="location.reload()" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl text-[10px] font-bold border border-red-100">خروج</button></div>
        </header>

        <div class="p-4">
            <div id="adsContainer" class="ads-grid"></div>

            <div id="adminUI" class="hidden mb-10 p-6 glass rounded-[2.5rem] shadow-2xl border-2 border-white reveal">
                <div class="flex bg-slate-100 p-1 rounded-2xl mb-6">
                    <button onclick="switchTab('prod')" class="flex-1 py-3 font-bold text-xs rounded-xl transition-all" id="btnP">المنتجات</button>
                    <button onclick="switchTab('ads')" class="flex-1 py-3 font-bold text-xs rounded-xl transition-all text-slate-400" id="btnA">الصور</button>
                </div>
                
                <div id="prodTab" class="space-y-3">
                    <input type="text" id="addCat" placeholder="الصنف" class="w-full p-4 rounded-2xl border-none bg-white shadow-sm outline-none font-bold text-sm">
                    <input type="text" id="addName" placeholder="اسم المنتج" class="w-full p-4 rounded-2xl border-none bg-white shadow-sm outline-none font-bold text-sm">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="addId" placeholder="كود المنتج" class="p-4 rounded-2xl border-none bg-white shadow-sm outline-none font-bold text-sm">
                        <input type="number" id="addPrice" placeholder="السعر" class="p-4 rounded-2xl border-none bg-white shadow-sm outline-none font-bold text-sm">
                    </div>
                    <label class="flex items-center gap-2 p-3 bg-white rounded-2xl shadow-sm"><input type="checkbox" id="isHot" class="w-5 h-5 accent-orange-500"><span class="text-xs font-bold text-slate-600">عرض خاص 🔥</span></label>
                    <button onclick="document.getElementById('fileImg').click()" class="w-full py-4 border-2 border-dashed border-slate-300 rounded-2xl text-slate-500 font-bold text-xs bg-white">📸 رفع صورة</button>
                    <input type="file" id="fileImg" accept="image/*" class="hidden" onchange="previewImage(this, 'imgPreview')">
                    <img id="imgPreview" class="hidden w-24 h-24 mx-auto rounded-2xl object-cover mt-2 shadow-md">
                    <button onclick="uploadProduct()" class="w-full bg-[#0f172a] text-white py-5 rounded-2xl font-black mt-4 shadow-xl">حفظ المنتج</button>
                </div>

                <div id="adsTab" class="hidden space-y-3">
                    <button onclick="document.getElementById('fileAd').click()" class="w-full py-10 border-2 border-dashed border-amber-300 rounded-2xl text-amber-600 font-bold text-xs bg-amber-50">🖼️ رفع صورة إعلان</button>
                    <input type="file" id="fileAd" accept="image/*" class="hidden" onchange="previewImage(this, 'adPreview')">
                    <img id="adPreview" class="hidden w-full h-40 rounded-2xl object-cover mt-2 shadow-md">
                    <button onclick="uploadAd()" class="w-full bg-amber-500 text-white py-5 rounded-2xl font-black shadow-xl">نشر الصورة</button>
                </div>
            </div>

            <div id="itemsGrid"></div>

            <footer class="mt-10 py-10 border-t border-slate-200 text-center">
                <p class="text-[10px] font-bold text-slate-400 tracking-widest italic">صمم بواسطة فريق مبيعات Hoco 🇮🇶</p>
            </footer>
        </div>
    </div>

    <div id="cartBar" style="display: none;" class="fixed bottom-6 left-4 right-4 glass-dark text-white p-6 rounded-[2.5rem] shadow-2xl z-50 flex justify-between items-center max-w-lg mx-auto reveal">
        <div class="flex flex-col"><span id="cartCount" class="font-black text-lg text-yellow-400">0 مواد</span><span id="totalPriceDisplay" class="text-xs text-white/60">0 د.ع</span></div>
        <button onclick="showCart()" class="bg-white text-[#0f172a] px-10 py-4 rounded-2xl text-sm font-black active:scale-90 transition-transform">عرض السلة</button>
    </div>

    <div id="cartModal" class="fixed inset-0 bg-black/40 backdrop-blur-xl z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-[3rem] w-full max-w-md p-8 shadow-2xl flex flex-col max-h-[85vh] reveal">
            <h2 class="text-2xl font-black text-center mb-8">تفاصيل الطلبية</h2>
            <div id="cartList" class="flex-1 overflow-y-auto space-y-4 mb-6 px-2"></div>
            <input type="text" id="customerLocation" placeholder="اكتب اسم المحل / العنوان" class="w-full p-5 rounded-2xl bg-slate-100 mb-6 text-center font-bold outline-none">
            <div class="grid grid-cols-2 gap-3">
                <button onclick="sendWhatsApp('9647870037165')" class="bg-[#25D366] text-white p-5 rounded-2xl text-xs font-black">ودوود</button>
                <button onclick="sendWhatsApp('9647737774427')" class="bg-[#25D366] text-white p-5 rounded-2xl text-xs font-black">سمر</button>
                <button onclick="sendWhatsApp('9647722897766')" class="bg-[#25D366] text-white p-5 rounded-2xl text-xs font-black">غادة</button>
                <button onclick="sendWhatsApp('9647870037167')" class="bg-[#25D366] text-white p-5 rounded-2xl text-xs font-black">مينا</button>
            </div>
            <button onclick="document.getElementById('cartModal').classList.add('hidden')" class="mt-6 text-slate-400 font-bold text-xs">إغلاق</button>
        </div>
    </div>

    <script type="module">
        import { addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let cart = [];
        let base64Img = "";

        window.switchTab = (tab) => {
            const isP = tab === 'prod';
            document.getElementById('prodTab').classList.toggle('hidden', !isP);
            document.getElementById('adsTab').classList.toggle('hidden', isP);
            document.getElementById('btnP').className = isP ? 'flex-1 py-3 font-bold text-xs rounded-xl bg-white shadow-sm' : 'flex-1 py-3 font-bold text-xs text-slate-400';
            document.getElementById('btnA').className = !isP ? 'flex-1 py-3 font-bold text-xs rounded-xl bg-white shadow-sm' : 'flex-1 py-3 font-bold text-xs text-slate-400';
        };

        window.previewImage = (input, targetId) => {
            const reader = new FileReader();
            reader.onload = (e) => { base64Img = e.target.result; const prev = document.getElementById(targetId); prev.src = base64Img; prev.classList.remove('hidden'); };
            reader.readAsDataURL(input.files[0]);
        };

        window.zoomImg = (src) => {
            const overlay = document.getElementById('imageOverlay');
            document.getElementById('fullImg').src = src;
            overlay.style.display = 'flex';
        };

        window.checkLogin = () => {
            const pass = document.getElementById('passInput').value;
            if(pass === "1234") { document.body.classList.add('is-admin'); startApp(); }
            else if(pass === "5555") { startApp(); } else { alert("الرمز خطأ"); }
        };

        function startApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('welcomeMsg').classList.add('show-welcome');
            loadAds();
            loadProducts();
        }

        function loadAds() {
            onSnapshot(query(window.dbAds, orderBy("time", "desc")), (snap) => {
                const cont = document.getElementById('adsContainer'); cont.innerHTML = '';
                snap.forEach(d => {
                    cont.innerHTML += `<div class="ad-item reveal">
                        <img src="${d.data().img}" onclick="zoomImg('${d.data().img}')">
                        <div class="admin-only absolute top-2 left-2 z-10"><button onclick="deleteAd('${d.id}')" class="bg-red-600 text-white p-1 rounded-full text-[8px]">✕ حذف</button></div>
                    </div>`;
                });
            });
        }

        window.uploadAd = async () => { if(base64Img) { await addDoc(window.dbAds, { img: base64Img, time: Date.now() }); alert("تم!"); location.reload(); } };
        window.deleteAd = async (id) => { if(confirm("حذف؟")) await deleteDoc(doc(window.dbDirect, "ads", id)); };

        window.uploadProduct = async () => {
            const n = document.getElementById('addName').value, p = document.getElementById('addPrice').value;
            const id = document.getElementById('addId').value, c = document.getElementById('addCat').value || "عام", hot = document.getElementById('isHot').checked;
            if(n && p) { await addDoc(window.dbCol, { name: n, price: Number(p), code: id, cat: c, img: base64Img, hot: hot, time: Date.now() }); location.reload(); }
        };

        function loadProducts() {
            onSnapshot(query(window.dbCol, orderBy("time", "desc")), (snap) => {
                const grid = document.getElementById('itemsGrid'); grid.innerHTML = '';
                const groups = {};
                snap.forEach(d => { const itm = d.data(); if(!groups[itm.cat]) groups[itm.cat] = []; groups[itm.cat].push({id: d.id, ...itm}); });

                let delay = 0.1;
                for(const cat in groups) {
                    let html = `<div class="category-header reveal" style="animation-delay:${delay}s">${cat}</div><div class="grid grid-cols-2 gap-4 mb-6">`;
                    groups[cat].forEach(item => {
                        delay += 0.05;
                        html += `<div class="product-card p-4 flex flex-col reveal shadow-sm" style="animation-delay:${delay}s">
                            ${item.hot ? '<div class="absolute top-3 left-3 bg-orange-500 text-white text-[8px] font-black px-2 py-1 rounded-lg z-10">HOT 🔥</div>' : ''}
                            <div class="admin-only absolute top-3 right-3 flex gap-1 z-20">
                                <button onclick="editName('${item.id}', '${item.name}')" class="bg-blue-500 text-white w-7 h-7 rounded-xl flex items-center justify-center text-[10px]">📝</button>
                                <button onclick="deleteItem('${item.id}')" class="bg-red-500 text-white w-7 h-7 rounded-xl flex items-center justify-center text-[10px]">✕</button>
                            </div>
                            <div class="h-28 flex items-center justify-center mb-4 overflow-hidden rounded-2xl bg-slate-50">
                                <img src="${item.img || 'https://placehold.co/200'}" class="max-h-full object-contain" onclick="zoomImg('${item.img}')">
                            </div>
                            <h2 class="text-[11px] font-black text-slate-600 line-clamp-2 h-8 leading-tight mb-2">${item.name}</h2>
                            <p class="text-maroon font-black text-sm mb-4 flex items-center gap-1">
                                <span>${item.price.toLocaleString()} د.ع</span>
                                <button onclick="editPrice('${item.id}', ${item.price})" class="admin-only text-slate-400 text-[10px]">📝</button>
                            </p>
                            <div class="flex items-center justify-between bg-slate-100 rounded-2xl p-1 mb-3">
                                <button onclick="changeQty('${item.id}', -1)" class="w-8 h-8 font-bold">-</button>
                                <span id="qty-${item.id}" class="text-xs font-bold">1</span>
                                <button onclick="changeQty('${item.id}', 1)" class="w-8 h-8 font-bold">+</button>
                            </div>
                            <button onclick="addToCart('${item.id}', '${item.name}', ${item.price}, '${item.code}')" class="bg-[#64748b] text-white py-4 rounded-2xl text-[10px] font-black active:scale-95 transition-all">إضافة للسلة</button>
                        </div>`;
                    });
                    grid.innerHTML += html + `</div>`;
                }
            });
        }

        window.editPrice = async (id, old) => { const n = prompt("السعر الجديد:", old); if(n) await updateDoc(doc(window.dbDirect, "products", id), { price: Number(n) }); };
        window.editName = async (id, old) => { const n = prompt("الاسم الجديد:", old); if(n) await updateDoc(doc(window.dbDirect, "products", id), { name: n }); };
        window.deleteItem = async (id) => { if(confirm("حذف؟")) await deleteDoc(doc(window.dbDirect, "products", id)); };
        window.changeQty = (id, v) => { let el = document.getElementById(`qty-${id}`); let n = parseInt(el.innerText) + v; if(n >= 1) el.innerText = n; };

        window.addToCart = (id, name, price, code) => {
            const qty = parseInt(document.getElementById(`qty-${id}`).innerText);
            const exist = cart.find(i => i.id === id);
            if(exist) exist.qty += qty; else cart.push({id, name, price, code, qty});
            document.getElementById('cartBar').style.display = 'flex';
            document.getElementById('cartCount').innerText = cart.length + " مواد";
            document.getElementById('totalPriceDisplay').innerText = cart.reduce((s, i) => s + (i.price * i.qty), 0).toLocaleString() + " د.ع";
        };

        window.showCart = () => {
            const list = document.getElementById('cartList'); list.innerHTML = '';
            cart.forEach(i => { list.innerHTML += `<div class="flex justify-between items-center bg-slate-50 p-4 rounded-3xl border border-slate-100"><div class="text-[10px] font-black">${i.name} <br> <span class="text-blue-600">العدد: ${i.qty}</span></div><div class="text-maroon font-black text-xs">${(i.price * i.qty).toLocaleString()} د.ع</div></div>`; });
            document.getElementById('cartModal').classList.remove('hidden');
        };

        window.sendWhatsApp = (phone) => {
            const loc = document.getElementById('customerLocation').value; if(!loc) return alert("اكتب العنوان");
            let total = 0, msg = `🧾 *طلب جديد - hoco. Elite*\n📍 *المحل:* ${loc}\n--------------------------\n`;
            cart.forEach((i, idx) => { let sub = i.price * i.qty; total += sub; msg += `*${idx+1}.* ${i.name}\n🔢 العدد: ${i.qty} | السعر: ${sub.toLocaleString()} د.ع\n🏷️ كود: ${i.code}\n--------------------------\n`; });
            msg += `💰 *المجموع الكلي: ${total.toLocaleString()} د.ع*`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`);
        };
    </script>
</body>
</html>
