
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>hoco. Elite Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAqqQ9j34XDw1_CvfWfuX_VTM66Y6C1C0SRHYJ", 
            authDomain: "hocoprice.firebaseapp.com",
            projectId: "hocoprice",
            appId: "1:367105764415:web:c2e2d7cb06fa489114757c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.dbCol = collection(db, "products");
        window.dbDirect = db;
        window.writeBatch = writeBatch;
    </script>

    <style>
        :root { --navy: #0f172a; --gold: #d4af37; --pearl: #f8fafc; }
        body { font-family: 'Tajawal', sans-serif; background: var(--pearl); color: var(--navy); }
        .is-admin .admin-only { display: flex !important; }
        .admin-only { display: none !important; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.1); }
        input, select { border: 1px solid #e2e8f0; border-radius: 1rem; padding: 0.75rem; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--gold); }
    </style>
</head>
<body class="pb-24">

    <header class="glass sticky top-0 z-50 p-4 border-b flex justify-between items-center">
        <button onclick="document.getElementById('adminUI').classList.toggle('hidden')" class="admin-only bg-slate-100 p-2 rounded-xl text-[10px] font-bold">⚙️ الإدارة</button>
        <h1 class="text-2xl font-black italic tracking-tighter text-[#0f172a]">hoco.</h1>
        <button onclick="location.reload()" class="text-red-500 font-bold text-[10px]">خروج</button>
    </header>

    <div id="adminUI" class="hidden m-4 space-y-4 max-w-2xl mx-auto fade-in">
        <div class="bg-slate-900 p-6 rounded-[2rem] text-white text-center shadow-xl">
            <h3 class="text-[#d4af37] font-black text-sm mb-4">تحديث المنتجات من الامين</h3>
            <input type="file" id="ameenExcel" accept=".xlsx, .xls" class="hidden" onchange="syncWithAmeen(this)">
            <button onclick="document.getElementById('ameenExcel').click()" class="w-full py-4 bg-[#d4af37] rounded-2xl font-black">رفع ملف المنتجات 📊</button>
            <button onclick="factoryReset()" class="mt-4 text-red-400 text-[10px] underline">تصفير شامل للمخزن 🗑️</button>
        </div>

        <div class="bg-white p-6 rounded-[2rem] card-shadow space-y-3">
            <h3 class="font-black text-sm">إضافة منتج/قسم يدوياً</h3>
            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="manualName" placeholder="اسم المنتج">
                <input type="text" id="manualCode" placeholder="كود المادة">
                <input type="number" id="manualPrice" placeholder="السعر">
                <input type="text" id="manualCat" placeholder="المجموعة (مثلاً: سماعات)">
            </div>
            <button onclick="manualAdd()" class="w-full bg-slate-900 text-white py-3 rounded-2xl font-bold">إضافة للمخزن</button>
        </div>
    </div>

    <main class="p-4 max-w-4xl mx-auto">
        <div id="homePage">
            <div class="mb-6"><input type="text" id="searchBox" oninput="doSearch()" placeholder="بحث عن منتج بالاسم أو الكود..." class="w-full p-5 bg-white shadow-sm font-bold"></div>
            <div id="categoryTabs" class="flex gap-2 overflow-x-auto no-scrollbar mb-6 pb-2"></div>
            <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
        </div>
    </main>

    <div id="cartBar" style="display:none;" class="fixed bottom-6 left-4 right-4 bg-slate-900 text-white p-5 rounded-[2rem] shadow-2xl flex justify-between items-center z-50">
        <div><p id="cCount" class="font-black">0 مادة</p><p id="cTotal" class="text-[#d4af37] text-xs">0 IQD</p></div>
        <button onclick="showCartModal()" class="bg-[#d4af37] px-8 py-3 rounded-xl font-black text-sm">إرسال الطلب</button>
    </div>

    <div id="checkoutModal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 max-h-[90vh] overflow-y-auto">
            <h2 class="text-2xl font-black mb-6">تفاصيل الزبون</h2>
            <div class="space-y-3 mb-6">
                <input type="text" id="custName" placeholder="اسم المحل / الزبون" class="w-full">
                <div class="flex gap-2">
                    <input type="text" id="custLoc" placeholder="رابط الموقع" class="flex-1 text-[10px]">
                    <button onclick="getMyLocation()" class="bg-slate-100 p-4 rounded-xl">📍</button>
                </div>
                <input type="text" id="custPoint" placeholder="أقرب نقطة دالة">
            </div>
            
            <div id="finalItems" class="space-y-2 mb-6 border-y py-4"></div>
            
            <h3 class="text-xs font-bold text-slate-400 mb-3">اختر الموظف لإرسال الطلب:</h3>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="finalizeOrder('9647870037165', 'ودود')" class="bg-green-600 text-white p-4 rounded-xl font-bold">ودود</button>
                <button onclick="finalizeOrder('9647737774427', 'سمر')" class="bg-green-600 text-white p-4 rounded-xl font-bold">سمر</button>
                <button onclick="finalizeOrder('9647722897766', 'غادة')" class="bg-green-600 text-white p-4 rounded-xl font-bold">غادة</button>
                <button onclick="finalizeOrder('9647870037167', 'اية')" class="bg-green-600 text-white p-4 rounded-xl font-bold">اية</button>
                <button onclick="finalizeOrder('9647704793024', 'حسابات')" class="bg-green-600 text-white p-4 rounded-xl font-bold">حسابات</button>
            </div>
            <button onclick="document.getElementById('checkoutModal').classList.add('hidden')" class="w-full mt-4 text-slate-400 text-sm">إلغاء</button>
        </div>
    </div>

    <script type="module">
        import { doc, getDocs, deleteDoc, updateDoc, addDoc, onSnapshot, query, orderBy, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let products = [];
        let cart = [];

        // التحقق من الدخول
        const pass = prompt("أدخل رمز الدخول:");
        if(pass === "1024") document.body.classList.add('is-admin');
        else if(pass !== "1234") { alert("خطأ!"); location.reload(); }

        // تحميل البيانات
        onSnapshot(query(window.dbCol, orderBy("time", "desc")), (snap) => {
            products = [];
            snap.forEach(d => products.push({id: d.id, ...d.data()}));
            renderCategories();
            renderProducts(products);
        });

        function renderCategories() {
            const cats = ["الكل", ...new Set(products.map(p => p.cat))];
            const cont = document.getElementById('categoryTabs');
            cont.innerHTML = cats.map(c => `<button onclick="filterCat('${c}')" class="px-6 py-2 bg-white rounded-full whitespace-nowrap shadow-sm font-bold text-xs border border-transparent hover:border-gold">${c}</button>`).join('');
        }

        window.filterCat = (c) => {
            const filtered = (c === "الكل") ? products : products.filter(p => p.cat === c);
            renderProducts(filtered);
        };

        window.doSearch = () => {
            const val = document.getElementById('searchBox').value.toLowerCase();
            renderProducts(products.filter(p => p.name.toLowerCase().includes(val) || String(p.code).includes(val)));
        };

        function renderProducts(data) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = data.map(p => `
                <div class="bg-white p-4 rounded-3xl card-shadow flex flex-col relative border border-transparent">
                    <div class="admin-only absolute top-2 right-2 flex flex-col gap-1 z-10">
                        <button onclick="editItem('${p.id}')" class="bg-white p-2 rounded-full shadow border">✏️</button>
                        <button onclick="deleteItem('${p.id}')" class="bg-white p-2 rounded-full shadow border text-red-500">✕</button>
                    </div>
                    <div class="h-32 mb-3 cursor-pointer" onclick="updateImg('${p.id}')">
                        <img src="${p.img || 'https://placehold.co/200?text=hoco'}" class="w-full h-full object-contain rounded-xl">
                    </div>
                    <h3 class="text-[10px] font-bold h-8 line-clamp-2 mb-1">${p.name}</h3>
                    <p class="text-gold font-black text-xs mb-3">${p.price.toLocaleString()} IQD</p>
                    <button onclick="addToCart('${p.id}')" class="bg-slate-900 text-white py-2 rounded-xl text-[10px] font-bold">إضافة للسلة</button>
                </div>
            `).join('');
        }

        window.addToCart = (id) => {
            const p = products.find(x => x.id === id);
            const exist = cart.find(x => x.id === id);
            if(exist) exist.qty++; else cart.push({...p, qty: 1});
            updateCartUI();
        };

        function updateCartUI() {
            document.getElementById('cartBar').style.display = cart.length ? 'flex' : 'none';
            document.getElementById('cCount').innerText = `${cart.length} مادة`;
            document.getElementById('cTotal').innerText = `${cart.reduce((s,i)=>s+(i.price*i.qty),0).toLocaleString()} IQD`;
        }

        window.getMyLocation = () => {
            navigator.geolocation.getCurrentPosition(p => {
                document.getElementById('custLoc').value = `https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
            });
        };

        window.showCartModal = () => {
            document.getElementById('checkoutModal').classList.remove('hidden');
            document.getElementById('finalItems').innerHTML = cart.map(i => `<div class="flex justify-between text-xs font-bold"><span>${i.name} (x${i.qty})</span><span>${(i.price*i.qty).toLocaleString()}</span></div>`).join('');
        };

        window.finalizeOrder = async (phone, emp) => {
            const name = document.getElementById('custName').value;
            const loc = document.getElementById('custLoc').value;
            const point = document.getElementById('custPoint').value;
            if(!name) return alert("سجل اسم المحل أولاً");

            let msg = `🧾 *طلب hoco جديد*\n👤 *الزبون:* ${name}\n📍 *الموقع:* ${loc}\n🏢 *نقطة دالة:* ${point}\n\n`;
            cart.forEach(i => msg += `• ${i.name} (x${i.qty})\n`);
            msg += `\n💰 *المجموع: ${cart.reduce((s,i)=>s+(i.price*i.qty),0).toLocaleString()} IQD*`;
            
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`);
            location.reload();
        };

        // وظائف الأدمن
        window.syncWithAmeen = async (input) => {
            const reader = new FileReader();
            reader.onload = async (e) => {
                const data = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
                const sheet = XLSX.utils.sheet_to_json(data.Sheets[data.SheetNames[0]]);
                const batch = window.writeBatch(window.dbDirect);
                for(const row of sheet) {
                    const d = { 
                        name: row["اسم المادة"], 
                        code: String(row["رمز المادة"]), 
                        price: Number(row["السعر"]), 
                        stock: Number(row["الكمية"]), 
                        cat: row["المجموعة"] || "أخرى", 
                        time: Date.now(), img: "" 
                    };
                    const newDoc = doc(window.dbCol);
                    batch.set(newDoc, d);
                }
                await batch.commit();
                alert("تم رفع آلاف المنتجات بنجاح ✅");
            };
            reader.readAsArrayBuffer(input.files[0]);
        };

        window.editItem = async (id) => {
            const p = products.find(x => x.id === id);
            const newName = prompt("تعديل الاسم:", p.name);
            const newPrice = prompt("تعديل السعر:", p.price);
            if(newName && newPrice) await updateDoc(doc(window.dbDirect, "products", id), { name: newName, price: Number(newPrice) });
        };

        window.updateImg = async (id) => {
            if(!document.body.classList.contains('is-admin')) return;
            const input = document.createElement('input'); input.type = 'file';
            input.onchange = (e) => {
                const r = new FileReader(); r.onload = async (re) => {
                    await updateDoc(doc(window.dbDirect, "products", id), { img: re.target.result });
                }; r.readAsDataURL(e.target.files[0]);
            }; input.click();
        };

        window.deleteItem = async (id) => { if(confirm("حذف المنتج؟")) await deleteDoc(doc(window.dbDirect, "products", id)); };
        window.manualAdd = async () => {
            const d = {
                name: document.getElementById('manualName').value,
                code: document.getElementById('manualCode').value,
                price: Number(document.getElementById('manualPrice').value),
                cat: document.getElementById('manualCat').value || "عام",
                time: Date.now(), img: ""
            };
            await addDoc(window.dbCol, d);
            alert("تمت الإضافة");
        };

        window.factoryReset = async () => {
            if(confirm("حذف كل البيانات؟")) {
                const snap = await getDocs(window.dbCol);
                snap.forEach(async d => await deleteDoc(doc(window.dbDirect, "products", d.id)));
                location.reload();
            }
        };
    </script>
</body>
</html>
