<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>hoco. Elite Ultra - Midnight Gold Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAqqQ9j34XDw1_CvfWfuX_VTM66Y6C1C0SRHYJ", 
            authDomain: "hocoprice.firebaseapp.com",
            projectId: "hocoprice",
            storageBucket: "hocoprice.firebasestorage.app",
            messagingSenderId: "367105764415",
            appId: "1:367105764415:web:c2e2d7cb06fa489114757c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.dbCol = collection(db, "products");
        window.dbAds = collection(db, "ads");
        window.dbSales = collection(db, "sales");
        window.dbDirect = db;
    </script>

    <style>
        :root { 
            --navy: #0f172a; 
            --gold: #d4af37; 
            --pearl: #f8fafc; 
        }

        body { font-family: 'Tajawal', sans-serif; background: var(--pearl); color: var(--navy); overflow-x: hidden; margin: 0; padding: 0; }

        /* شاشة التحميل السينمائية */
        #splashScreen {
            position: fixed; inset: 0; z-index: 200; background: var(--navy);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .logo-cinema {
            font-size: 5rem; font-weight: 900; color: var(--gold); font-style: italic;
            letter-spacing: -3px; opacity: 0;
            animation: cinemaReveal 3s ease-in-out infinite;
        }
        
        @keyframes cinemaReveal {
            0% { opacity: 0; transform: scale(0.9); filter: blur(10px); }
            50% { opacity: 1; transform: scale(1); filter: blur(0px); }
            100% { opacity: 0; transform: scale(1.05); filter: blur(5px); }
        }

        .fade-in { animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(15, 23, 42, 0.05); }
        .card-shadow { box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.1); border: 1px solid rgba(15, 23, 42, 0.03); }
        
        .category-card { border-radius: 30px; position: relative; overflow: hidden; height: 190px; transition: 0.4s; }
        .category-card img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; }
        .category-card:hover img { transform: scale(1.1); }
        .category-card-overlay { 
            position: absolute; inset: 0; 
            background: linear-gradient(0deg, rgba(15, 23, 42, 0.9) 0%, rgba(15, 23, 42, 0) 60%); 
            display: flex; align-items: flex-end; padding: 20px; 
        }
        
        .is-admin .admin-only { display: flex !important; }
        .admin-only { display: none !important; }

        #imageOverlay { display: none; position: fixed; inset: 0; z-index: 300; background: rgba(15, 23, 42, 0.98); align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .btn-gold { background: var(--gold); color: white; transition: 0.3s; }
        .btn-gold:active { transform: scale(0.95); opacity: 0.9; }
        .btn-navy { background: var(--navy); color: white; transition: 0.3s; }
    </style>
</head>
<body class="pb-32">

    <div id="splashScreen">
        <div class="logo-cinema">hoco.</div>
    </div>

    <div id="imageOverlay" onclick="this.style.display='none'"><img id="fullImg" src="" class="max-w-[90%] max-h-[80%] rounded-2xl shadow-2xl"></div>

    <div id="loginScreen" class="fixed inset-0 z-[100] bg-[#0f172a] hidden flex flex-col items-center justify-center p-10 text-center fade-in">
        <div class="mb-12">
            <h1 class="text-5xl font-black text-[#d4af37] italic mb-2 tracking-tighter">hoco.</h1>
            <p class="text-white/30 text-[10px] tracking-[0.4em] uppercase">Elite Distribution</p>
        </div>
        <div class="w-full max-w-xs space-y-4">
            <input type="password" id="passInput" placeholder="رمز الدخول" class="w-full p-6 rounded-[2rem] text-center text-xl font-bold bg-white/5 border border-white/10 text-white outline-none focus:border-[#d4af37]/50 transition-all">
            <button onclick="checkLogin()" class="w-full btn-gold py-6 rounded-[2rem] font-black text-lg shadow-2xl">تسجيل دخول</button>
        </div>
    </div>

    <div id="mainContent" class="hidden">
        <header class="glass-header sticky top-0 z-50">
            <div class="p-5 flex justify-between items-center max-w-4xl mx-auto">
                <div class="w-20"><button onclick="document.getElementById('adminUI').classList.toggle('hidden')" class="admin-only bg-slate-100 text-slate-900 px-4 py-2 rounded-xl text-[10px] font-bold">لوحة التحكم</button></div>
                <h1 class="text-2xl font-black italic tracking-tighter text-[#0f172a]" onclick="showHomePage()">hoco.</h1>
                <div class="w-20 text-left"><button onclick="location.reload()" class="text-red-500 font-bold text-[10px]">خروج</button></div>
            </div>
        </header>

        <div id="adminUI" class="hidden m-4 p-8 bg-white rounded-[3rem] card-shadow max-w-2xl mx-auto fade-in">
            <div class="flex bg-slate-50 p-1.5 rounded-2xl mb-8 border">
                <button onclick="switchTab('prod')" class="flex-1 py-3 font-bold text-[11px] rounded-xl bg-white shadow-sm" id="btnP">إدارة المخزن</button>
                <button onclick="switchTab('reports'); loadReports();" class="flex-1 py-3 font-bold text-[11px] rounded-xl text-slate-400" id="btnR">التقارير اليومية</button>
            </div>
            
            <div id="prodTab" class="space-y-5">
                <div class="p-8 bg-slate-900 rounded-[2.5rem] text-center border border-white/10 shadow-xl">
                    <p class="text-[10px] font-bold text-[#d4af37] mb-4 uppercase tracking-widest">مزامنة البيانات مع الأمين</p>
                    <input type="file" id="ameenExcel" accept=".xlsx, .xls" class="hidden" onchange="syncWithAmeen(this)">
                    <button onclick="document.getElementById('ameenExcel').click()" class="w-full py-5 btn-gold rounded-2xl font-black text-xs">رفع ملف Excel 📊</button>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="addName" placeholder="الاسم يدوياً" class="p-4 rounded-2xl bg-slate-50 border-none font-bold text-xs outline-none focus:ring-1 ring-[#d4af37]">
                    <input type="text" id="addId" placeholder="كود المنتج" class="p-4 rounded-2xl bg-slate-50 border-none font-bold text-xs outline-none focus:ring-1 ring-[#d4af37]">
                </div>
                <button onclick="document.getElementById('fileImg').click()" class="w-full py-4 border-2 border-dashed border-slate-200 rounded-2xl text-slate-400 font-bold text-[10px] hover:bg-slate-50">📸 إضافة صورة للمنتج</button>
                <input type="file" id="fileImg" accept="image/*" class="hidden" onchange="previewImage(this, 'imgPreview')">
                <img id="imgPreview" class="hidden w-24 h-24 mx-auto rounded-3xl object-cover mt-2 card-shadow">
                <button onclick="uploadProductManually()" class="w-full btn-navy py-5 rounded-2xl font-black text-xs shadow-lg">حفظ المنتج</button>
                <hr class="opacity-5">
                <button onclick="document.getElementById('fileAd').click()" class="w-full py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold text-xs">🖼️ تحديث البنرات الإعلانية</button>
                <input type="file" id="fileAd" accept="image/*" class="hidden" onchange="uploadAd(this)">
            </div>

            <div id="reportsTab" class="hidden space-y-4 fade-in">
                <div class="bg-[#0f172a] p-8 rounded-[2.5rem] text-center shadow-xl border-b-4 border-[#d4af37]">
                    <p class="text-white/40 text-[10px] font-bold uppercase mb-2">إجمالي مبيعات اليوم</p>
                    <h3 id="totalSalesAmount" class="text-3xl font-black text-[#d4af37]">0 د.ع</h3>
                </div>
                <div id="reportsList" class="space-y-3 max-h-80 overflow-y-auto no-scrollbar pr-1"></div>
            </div>
        </div>

        <div class="max-w-4xl mx-auto p-5">
            <div id="homePage" class="fade-in">
                <div class="mb-10 mt-4 px-1">
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.3em] mb-2">Welcome Back</p>
                    <h2 class="text-4xl font-black text-[#0f172a] italic tracking-tighter">ابدأ طلبيتك الجديدة الآن</h2>
                </div>

                <div id="adsContainer" class="flex overflow-x-auto gap-6 mb-12 no-scrollbar pb-2"></div>

                <div class="flex justify-between items-center mb-8 px-1">
                    <h3 class="text-xl font-black text-slate-800">الأقسام</h3>
                    <span class="text-[10px] font-black text-[#d4af37] border-b border-[#d4af37] pb-1 uppercase" onclick="showProductsPage('كل المنتجات')">عرض الكل</span>
                </div>

                <div id="categoryGrid" class="grid grid-cols-2 gap-6"></div>
            </div>

            <div id="productsPage" class="hidden fade-in">
                <div class="mb-8 sticky top-[85px] z-40 py-2">
                    <input type="text" id="searchInput" oninput="filterProducts()" placeholder="ابحث عن منتج..." class="w-full p-5 bg-white rounded-[2rem] card-shadow text-sm outline-none font-bold">
                </div>

                <div class="flex items-center gap-5 mb-10">
                    <button onclick="showHomePage()" class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center card-shadow active:scale-90 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" /></svg>
                    </button>
                    <h2 id="currentCategoryTitle" class="text-2xl font-black text-slate-800 italic">المنتجات</h2>
                </div>

                <div id="itemsGrid" class="grid grid-cols-2 gap-5"></div>
            </div>
        </div>
    </div>

    <div id="cartBar" style="display: none;" class="fixed bottom-8 left-6 right-6 bg-[#0f172a] text-white p-7 rounded-[2.5rem] shadow-2xl z-50 flex justify-between items-center max-w-lg mx-auto fade-in border border-white/5">
        <div class="flex flex-col"><span id="cartCount" class="font-black text-lg">0 مادة</span><span id="totalPriceDisplay" class="text-[10px] text-[#d4af37] font-bold">0 IQD</span></div>
        <button onclick="showCart()" class="btn-gold px-12 py-4 rounded-2xl text-xs font-black shadow-lg">طلب القائمة</button>
    </div>

    <div id="cartModal" class="fixed inset-0 bg-[#0f172a]/95 backdrop-blur-xl z-[60] hidden flex items-center justify-center p-5">
        <div class="bg-white rounded-[3.5rem] w-full max-w-md p-10 shadow-2xl flex flex-col max-h-[90vh] overflow-y-auto no-scrollbar">
            <h2 class="text-3xl font-black text-center mb-10 italic text-[#0f172a]">Checkout</h2>
            <div id="cartList" class="space-y-4 mb-10"></div>
            <div class="bg-slate-50 p-8 rounded-[2.5rem] mb-10 flex justify-between items-center border">
                <span class="font-bold text-slate-400 text-xs">المجموع الكلي</span>
                <span id="finalTotal" class="text-2xl font-black text-[#0f172a]">0 د.ع</span>
            </div>
            <div class="space-y-4 mb-10">
                <input type="text" id="customerName" placeholder="اسم المحل" class="w-full p-5 rounded-2xl bg-slate-50 border-none font-bold text-sm outline-none">
                <div class="flex gap-2">
                    <input type="text" id="customerLoc" placeholder="الموقع الجغرافي" class="flex-1 p-5 rounded-2xl bg-slate-50 border-none font-bold text-[10px] outline-none">
                    <button onclick="getLocation()" class="bg-[#0f172a] text-white px-6 rounded-2xl">📍</button>
                </div>
                <input type="text" id="customerPoint" placeholder="أقرب نقطة دالة" class="w-full p-5 rounded-2xl bg-slate-50 border-none font-bold text-sm outline-none">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="sendWhatsApp('9647870037165', 'ودود')" class="bg-green-600 text-white p-5 rounded-2xl text-[11px] font-black active:scale-95 shadow-lg">ودود</button>
                <button onclick="sendWhatsApp('9647737774427', 'سمر')" class="bg-green-600 text-white p-5 rounded-2xl text-[11px] font-black active:scale-95 shadow-lg">سمر</button>
                <button onclick="sendWhatsApp('9647722897766', 'غادة')" class="bg-green-600 text-white p-5 rounded-2xl text-[11px] font-black active:scale-95 shadow-lg">غادة</button>
                <button onclick="sendWhatsApp('9647870037167', 'مينا')" class="bg-green-600 text-white p-5 rounded-2xl text-[11px] font-black active:scale-95 shadow-lg">مينا</button>
            </div>
            <button onclick="document.getElementById('cartModal').classList.add('hidden')" class="mt-8 text-slate-300 font-bold text-[10px] uppercase text-center">إغلاق</button>
        </div>
    </div>

    <script type="module">
        import { updateDoc, doc, addDoc, onSnapshot, query, orderBy, deleteDoc, getDocs, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let cart = [];
        let allProducts = [];
        let base64Img = "";

        // Splash handling
        setTimeout(() => {
            const s = document.getElementById('splashScreen');
            s.style.opacity = '0'; s.style.transition = '1s';
            setTimeout(() => { s.style.display = 'none'; document.getElementById('loginScreen').classList.remove('hidden'); }, 1000);
        }, 3000);

        window.checkLogin = () => {
            const p = document.getElementById('passInput').value;
            if(p === "1234") { document.body.classList.add('is-admin'); startApp(); }
            else if(p === "5555") { startApp(); } else { alert("الرمز خاطئ"); }
        };

        function startApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            loadData();
        }

        function loadData() {
            onSnapshot(query(window.dbCol, orderBy("time", "desc")), (snap) => {
                allProducts = [];
                snap.forEach(d => allProducts.push({id: d.id, ...d.data()}));
                buildUI();
            });
            onSnapshot(query(window.dbAds, orderBy("time", "desc")), (snap) => {
                const cont = document.getElementById('adsContainer'); cont.innerHTML = '';
                snap.forEach(d => {
                    cont.innerHTML += `<div class="min-w-[320px] h-52 bg-slate-100 rounded-[2.5rem] overflow-hidden relative flex-shrink-0 card-shadow">
                        <img src="${d.data().img}" class="w-full h-full object-cover">
                        <button onclick="deleteAd('${d.id}')" class="admin-only absolute top-5 left-5 bg-black/50 text-white p-2 rounded-full text-[8px] backdrop-blur-md">✕</button>
                    </div>`;
                });
            });
        }

        window.showHomePage = () => {
            document.getElementById('homePage').classList.remove('hidden');
            document.getElementById('productsPage').classList.add('hidden');
            window.scrollTo({top: 0, behavior: 'smooth'});
        };

        window.showProductsPage = (cat) => {
            document.getElementById('homePage').classList.add('hidden');
            document.getElementById('productsPage').classList.remove('hidden');
            document.getElementById('currentCategoryTitle').innerText = cat;
            const filtered = (cat === 'كل المنتجات') ? allProducts : allProducts.filter(p => p.cat === cat);
            renderItems(filtered);
            window.scrollTo({top: 0, behavior: 'smooth'});
        };

        function buildUI() {
            const grid = document.getElementById('categoryGrid'); grid.innerHTML = '';
            const cats = [...new Set(allProducts.map(p => p.cat))];
            cats.forEach(c => {
                const first = allProducts.find(p => p.cat === c && p.img);
                grid.innerHTML += `
                    <div class="category-card card-shadow fade-in" onclick="showProductsPage('${c}')">
                        <img src="${first ? first.img : 'https://placehold.co/400x400'}" loading="lazy">
                        <div class="category-card-overlay"><h4 class="text-white font-black text-sm">${c}</h4></div>
                    </div>
                `;
            });
        }

        function renderItems(data) {
            const grid = document.getElementById('itemsGrid'); grid.innerHTML = '';
            data.forEach(item => {
                const isOut = item.stock <= 0;
                grid.innerHTML += `<div class="bg-white p-5 rounded-[2rem] flex flex-col fade-in card-shadow relative">
                    <div class="absolute top-4 left-4 z-10"><span class="${isOut ? 'bg-red-500' : 'bg-[#0f172a]'} text-white text-[7px] px-2.5 py-1 rounded-full font-black uppercase">${isOut ? 'نفذت' : 'المتوفر: ' + item.stock}</span></div>
                    <div class="admin-only absolute top-4 right-4 flex flex-col gap-1 z-20">
                        <button onclick="updateImage('${item.id}')" class="bg-white text-[#0f172a] w-8 h-8 rounded-full text-[10px] shadow-sm border">📷</button>
                        <button onclick="deleteItem('${item.id}')" class="bg-white text-red-500 w-8 h-8 rounded-full text-[10px] shadow-sm border">✕</button>
                    </div>
                    <div class="h-44 flex items-center justify-center mb-4" onclick="zoomImg('${item.img}')">
                        <img src="${item.img || 'https://placehold.co/200'}" class="max-h-full object-contain ${isOut ? 'grayscale opacity-30' : ''}">
                    </div>
                    <h2 class="text-[11px] font-bold text-slate-800 h-9 line-clamp-2 leading-tight mb-2">${item.name}</h2>
                    <span class="text-[#0f172a] font-black text-sm mb-4">${item.price.toLocaleString()} IQD</span>
                    <input type="number" id="qty-${item.id}" value="1" min="1" class="w-full p-4 bg-slate-50 rounded-2xl text-center font-black text-xs mb-4 outline-none border-none">
                    <button onclick="addToCart('${item.id}', '${item.name}', ${item.price}, '${item.code}', ${item.stock})" ${isOut ? 'disabled' : ''} class="${isOut ? 'bg-slate-100 text-slate-400' : 'btn-navy'} py-4 rounded-2xl text-[10px] font-black">إضافة للقائمة</button>
                </div>`;
            });
        }

        window.addToCart = (id, name, price, code, max) => {
            const qty = parseInt(document.getElementById(`qty-${id}`).value);
            if(qty > max) return alert("الكمية غير كافية بالمخزن");
            const exist = cart.find(i => i.id === id);
            if(exist) exist.qty += qty; else cart.push({id, name, price, code, qty});
            updateCartBar();
        };

        function updateCartBar() {
            document.getElementById('cartBar').style.display = 'flex';
            document.getElementById('cartCount').innerText = cart.length + " مادة";
            document.getElementById('totalPriceDisplay').innerText = cart.reduce((s, i) => s + (i.price * i.qty), 0).toLocaleString() + " IQD";
        }

        window.showCart = () => {
            const list = document.getElementById('cartList'); list.innerHTML = '';
            cart.forEach(i => {
                list.innerHTML += `<div class="flex justify-between items-center bg-slate-50 p-5 rounded-3xl text-[11px] font-black border">
                    <div class="flex flex-col"><span class="text-[#0f172a]">${i.name}</span><span class="text-slate-400">العدد: ${i.qty}</span></div>
                    <span>${(i.price * i.qty).toLocaleString()}</span>
                </div>`;
            });
            document.getElementById('finalTotal').innerText = cart.reduce((s, i) => s + (i.price * i.qty), 0).toLocaleString() + " د.ع";
            document.getElementById('cartModal').classList.remove('hidden');
        };

        window.sendWhatsApp = async (phone, seller) => {
            const name = document.getElementById('customerName').value;
            const point = document.getElementById('customerPoint').value;
            if(!name || !point) return alert("يرجى إدخال اسم المحل والعنوان");
            let total = 0, msg = `🧾 *طلب جديد hoco.*\n👤 *المحل:* ${name}\n📍 *العنوان:* ${point}\n--------------------------\n`;
            for(const i of cart) {
                total += (i.price * i.qty);
                msg += `• ${i.name} (x${i.qty})\n💰 ${ (i.price * i.qty).toLocaleString() } IQD\n--------------------------\n`;
                const prod = allProducts.find(p => p.id === i.id);
                await updateDoc(doc(window.dbDirect, "products", i.id), { stock: prod.stock - i.qty });
            }
            msg += `💰 *المجموع: ${total.toLocaleString()} IQD*`;
            await addDoc(window.dbSales, { customer: name, total, seller, time: Date.now(), dateStr: new Date().toLocaleDateString('ar-EG') });
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`);
            location.reload();
        };

        window.syncWithAmeen = async (input) => {
            const reader = new FileReader();
            reader.onload = async (e) => {
                const data = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
                const sheet = XLSX.utils.sheet_to_json(data.Sheets[data.SheetNames[0]]);
                for(const row of sheet) {
                    const code = String(row["رمز المادة"] || "");
                    const name = row["اسم المادة"] || "";
                    const price = Number(row["السعر"] || 0);
                    const stock = Number(row["الكمية"] || 0);
                    const cat = row["المجموعة"] || "أخرى";
                    if(code) {
                        const p = allProducts.find(x => String(x.code) === code);
                        if(p) await updateDoc(doc(window.dbDirect, "products", p.id), { stock, price, name, cat });
                        else await addDoc(window.dbCol, { name, code, price, stock, cat, img: "", time: Date.now() });
                    }
                }
                alert("تم تحديث البيانات بنجاح ✅"); location.reload();
            };
            reader.readAsArrayBuffer(input.files[0]);
        };

        window.getLocation = () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(p => {
                    document.getElementById('customerLoc').value = `http://google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
                });
            }
        };

        window.previewImage = (input, tid) => {
            const r = new FileReader(); r.onload = (e) => { base64Img = e.target.result; document.getElementById(tid).src = e.target.result; document.getElementById(tid).classList.remove('hidden'); };
            r.readAsDataURL(input.files[0]);
        };

        window.uploadAd = (input) => {
            const r = new FileReader(); r.onload = async (e) => { await addDoc(window.dbAds, { img: e.target.result, time: Date.now() }); location.reload(); };
            r.readAsDataURL(input.files[0]);
        };

        window.uploadProductManually = async () => {
            const n = document.getElementById('addName').value, id = document.getElementById('addId').value;
            if(n && id) { await addDoc(window.dbCol, { name: n, code: id, price: 0, stock: 0, cat: "أخرى", img: base64Img, time: Date.now() }); location.reload(); }
        };

        window.updateImage = (id) => {
            const i = document.createElement('input'); i.type = 'file'; i.onchange = (e) => {
                const r = new FileReader(); r.onload = async (re) => { await updateDoc(doc(window.dbDirect, "products", id), { img: re.target.result }); location.reload(); };
                r.readAsDataURL(e.target.files[0]);
            }; i.click();
        };

        window.loadReports = async () => {
            const snap = await getDocs(query(window.dbSales, orderBy("time", "desc")));
            const list = document.getElementById('reportsList'); list.innerHTML = '';
            let total = 0; const today = new Date().toLocaleDateString('ar-EG');
            snap.forEach(d => {
                const s = d.data(); if(s.dateStr === today) total += s.total;
                list.innerHTML += `<div class="bg-slate-50 p-6 rounded-[1.5rem] border text-[11px] font-bold mb-2">
                    <div class="flex justify-between mb-1"><span class="text-[#0f172a]">${s.customer}</span><span>${s.total.toLocaleString()}</span></div>
                    <div class="text-slate-400">البائع: ${s.seller} | ${s.dateStr}</div>
                </div>`;
            });
            document.getElementById('totalSalesAmount').innerText = total.toLocaleString() + " IQD";
        };

        window.zoomImg = (s) => { if(s) { document.getElementById('fullImg').src = s; document.getElementById('imageOverlay').style.display = 'flex'; } };
        window.deleteItem = async (id) => { if(confirm("حذف؟")) await deleteDoc(doc(window.dbDirect, "products", id)); };
        window.deleteAd = async (id) => { if(confirm("حذف؟")) await deleteDoc(doc(window.dbAds, id)); };
        window.switchTab = (t) => { 
            document.getElementById('prodTab').classList.toggle('hidden', t !== 'prod'); 
            document.getElementById('reportsTab').classList.toggle('hidden', t !== 'reports'); 
            document.getElementById('btnP').className = t === 'prod' ? 'flex-1 py-3 font-bold text-[11px] rounded-xl bg-white shadow-sm' : 'flex-1 py-3 font-bold text-[11px] rounded-xl text-slate-400';
            document.getElementById('btnR').className = t === 'reports' ? 'flex-1 py-3 font-bold text-[11px] rounded-xl bg-white shadow-sm' : 'flex-1 py-3 font-bold text-[11px] rounded-xl text-slate-400';
        };
        window.filterProducts = () => {
            const t = document.getElementById('searchInput').value.toLowerCase();
            renderItems(allProducts.filter(p => p.name.toLowerCase().includes(t) || String(p.code).includes(t)));
        };
    </script>
</body>
</html>
