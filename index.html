<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>hoco. Elite Pro System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAqqQ9j34XDw1_CvfWfuX_VTM66Y6C1C0SRHYJ", 
            authDomain: "hocoprice.firebaseapp.com",
            projectId: "hocoprice",
            storageBucket: "hocoprice.firebasestorage.app",
            messagingSenderId: "367105764415",
            appId: "1:367105764415:web:c2e2d7cb06fa489114757c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.dbCol = collection(db, "products");
        window.dbAds = collection(db, "ads");
        window.dbDirect = db;
    </script>

    <style>
        :root { --primary: #0f172a; --maroon: #800000; --bg: #f8fafc; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--primary); -webkit-tap-highlight-color: transparent; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-item { animation: fadeInUp 0.4s ease forwards; }

        @keyframes fadeOut { 0% { opacity: 1; visibility: visible; } 80% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
        #welcomeMsg { animation: fadeOut 4s forwards; }

        .card { background: white; border-radius: 20px; border: 1px solid #f1f5f9; position: relative; overflow: hidden; }
        .admin-only { display: none; }
        .is-admin .admin-only { display: flex !important; }
        
        .category-header { background: #0f172a; color: white; padding: 8px 18px; border-radius: 12px; font-size: 13px; font-weight: 900; margin: 25px 0 12px 0; display: inline-block; }
        
        .ads-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px; padding: 10px 5px; scrollbar-width: none; }
        .ads-slider::-webkit-scrollbar { display: none; }
        .ad-card { flex: 0 0 100%; scroll-snap-align: center; border-radius: 25px; height: 160px; overflow: hidden; position: relative; box-shadow: 0 10px 20px -10px rgba(0,0,0,0.2); }
        .ad-card img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body class="pb-40">

    <div id="welcomeMsg" class="fixed inset-0 z-[200] flex items-center justify-center p-6 bg-[#0f172a]/90 backdrop-blur-lg text-center hidden">
        <div class="animate-item">
            <div class="text-6xl mb-4">🇮🇶</div>
            <h2 class="text-white text-2xl font-black mb-2">أهلاً بك في hoco. Iraq</h2>
            <p class="text-slate-300 text-sm leading-relaxed">كل تفصيله بهالنظام معمولة بحب حتى تختصر عليكم الوقت والتعب ..<br><span class="text-amber-400 font-bold mt-2 block">فريق مبيعات Hoco Iraq 🇮🇶</span></p>
        </div>
    </div>

    <div id="loginScreen" class="fixed inset-0 z-[100] bg-[#0f172a] flex flex-col items-center justify-center p-8">
        <h1 class="text-5xl font-black text-white italic mb-10 tracking-tighter">hoco.</h1>
        <div class="w-full max-w-xs space-y-4">
            <input type="password" id="passInput" placeholder="ادخل الرمز" class="w-full p-5 rounded-3xl text-center text-lg font-bold bg-white/10 border border-white/20 text-white outline-none">
            <button onclick="checkLogin()" class="w-full bg-white text-[#0f172a] py-5 rounded-3xl font-black shadow-2xl active:scale-95 transition-all">فتح النظام</button>
        </div>
    </div>

    <div id="mainContent" class="hidden">
        <header class="bg-[#0f172a] sticky top-0 z-50 p-4 flex justify-between items-center shadow-lg">
            <div class="w-20"><button id="adminBtn" onclick="document.getElementById('adminUI').classList.toggle('hidden')" class="hidden bg-white/10 text-white p-2 rounded-xl text-[8px] font-bold border border-white/10">إدارة +</button></div>
            <h1 class="text-2xl font-black text-white italic tracking-tighter">hoco. Elite</h1>
            <div class="w-20 text-left"><button onclick="location.reload()" class="bg-rose-600 text-white px-3 py-2 rounded-xl text-[10px] font-bold">خروج</button></div>
        </header>

        <div class="p-4">
            <div id="adsContainer" class="ads-slider mb-2"></div>

            <div id="adminUI" class="hidden mb-6 p-6 bg-white rounded-[30px] shadow-2xl border-2 border-blue-50">
                <div class="flex border-b mb-4">
                    <button onclick="switchTab('prod')" class="flex-1 pb-2 font-bold text-xs text-blue-600">منتجات</button>
                    <button onclick="switchTab('ads')" class="flex-1 pb-2 font-bold text-xs text-slate-400">إعلانات</button>
                </div>
                
                <div id="prodTab" class="space-y-3">
                    <input type="text" id="addCat" placeholder="الصنف (مثلاً: شواحن)" class="w-full p-4 rounded-2xl bg-slate-50 border outline-none text-sm font-bold">
                    <input type="text" id="addName" placeholder="اسم المنتج" class="w-full p-4 rounded-2xl bg-slate-50 border outline-none text-sm font-bold">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="addId" placeholder="الكود" class="p-4 rounded-2xl bg-slate-50 border outline-none text-sm font-bold">
                        <input type="number" id="addPrice" placeholder="السعر" class="p-4 rounded-2xl bg-slate-50 border outline-none text-sm font-bold">
                    </div>
                    <button onclick="document.getElementById('fileImg').click()" class="w-full p-4 rounded-2xl bg-blue-50 border-2 border-dashed border-blue-200 text-blue-600 font-bold text-[10px]">📸 اختر صورة المنتج</button>
                    <input type="file" id="fileImg" accept="image/*" class="hidden" onchange="previewImage(this, 'imgPreview')">
                    <img id="imgPreview" class="hidden w-20 h-20 mx-auto rounded-xl object-cover border mt-2">
                    <button onclick="uploadProduct()" class="w-full bg-[#0f172a] text-white py-4 rounded-2xl font-black">حفظ المنتج</button>
                </div>

                <div id="adsTab" class="hidden space-y-3">
                    <button onclick="document.getElementById('fileAd').click()" class="w-full p-8 rounded-2xl bg-amber-50 border-2 border-dashed border-amber-200 text-amber-600 font-bold text-xs">🖼️ اختر صورة الإعلان</button>
                    <input type="file" id="fileAd" accept="image/*" class="hidden" onchange="previewImage(this, 'adPreview')">
                    <img id="adPreview" class="hidden w-full h-32 rounded-xl object-cover border mt-2">
                    <button onclick="uploadAd()" class="w-full bg-amber-500 text-white py-4 rounded-2xl font-black">نشر الإعلان</button>
                </div>
            </div>

            <div id="itemsGrid" class="pb-10"></div>
        </div>

        <footer class="mt-10 py-10 border-t border-slate-100 text-center">
            <p class="text-[10px] font-bold text-slate-300 tracking-widest uppercase italic">صمم بواسطة فريق مبيعات Hoco 🇮🇶</p>
        </footer>
    </div>

    <div id="cartBar" style="display: none;" class="fixed bottom-6 left-4 right-4 bg-[#0f172a] text-white p-5 rounded-[25px] shadow-2xl z-50 flex justify-between items-center max-w-lg mx-auto">
        <div class="flex flex-col"><span id="cartCount" class="font-black text-sm text-yellow-400">0 مواد</span><span id="totalPriceDisplay" class="text-[10px] text-white/70">0 د.ع</span></div>
        <button onclick="showCart()" class="bg-maroon text-white px-8 py-3.5 rounded-2xl text-xs font-black">عرض الطلبية</button>
    </div>

    <div id="cartModal" class="fixed inset-0 bg-slate-900/95 backdrop-blur-md z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-[40px] w-full max-w-md p-8 shadow-2xl flex flex-col max-h-[90vh]">
            <h2 class="text-xl font-black text-center mb-6 italic">تفاصيل الطلبية</h2>
            <div id="cartList" class="flex-1 overflow-y-auto space-y-3 mb-6 pr-2"></div>
            <input type="text" id="customerLocation" placeholder="اكتب اسم المحل أو العنوان..." class="w-full p-4 rounded-2xl bg-yellow-50 border-2 border-yellow-100 mb-4 text-center text-sm font-bold outline-none">
            <div class="grid grid-cols-2 gap-2">
                <button onclick="sendWhatsApp('9647870037165')" class="bg-[#25D366] text-white p-4 rounded-2xl text-[10px] font-black">ودوود</button>
                <button onclick="sendWhatsApp('9647737774427')" class="bg-[#25D366] text-white p-4 rounded-2xl text-[10px] font-black">سمر</button>
                <button onclick="sendWhatsApp('9647722897766')" class="bg-[#25D366] text-white p-4 rounded-2xl text-[10px] font-black">غادة</button>
                <button onclick="sendWhatsApp('9647870037167')" class="bg-[#25D366] text-white p-4 rounded-2xl text-[10px] font-black">مينا</button>
            </div>
            <button onclick="document.getElementById('cartModal').classList.add('hidden')" class="mt-4 text-slate-400 text-[10px] font-bold">إغلاق</button>
        </div>
    </div>

    <script type="module">
        import { addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let cart = [];
        let base64Img = "";

        window.switchTab = (tab) => {
            document.getElementById('prodTab').classList.toggle('hidden', tab !== 'prod');
            document.getElementById('adsTab').classList.toggle('hidden', tab !== 'ads');
        };

        window.previewImage = (input, targetId) => {
            const reader = new FileReader();
            reader.onload = (e) => { base64Img = e.target.result; const prev = document.getElementById(targetId); prev.src = base64Img; prev.classList.remove('hidden'); };
            reader.readAsDataURL(input.files[0]);
        };

        window.checkLogin = () => {
            const pass = document.getElementById('passInput').value;
            if(pass === "1234") { document.getElementById('adminBtn').classList.remove('hidden'); document.body.classList.add('is-admin'); startApp(); }
            else if(pass === "5555") { startApp(); } else { alert("الرمز خطأ"); }
        };

        function startApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('welcomeMsg').classList.remove('hidden');
            loadAds();
            loadProducts();
        }

        function loadAds() {
            onSnapshot(query(window.dbAds, orderBy("time", "desc")), (snap) => {
                const cont = document.getElementById('adsContainer'); cont.innerHTML = '';
                snap.forEach(d => {
                    cont.innerHTML += `<div class="ad-card animate-item">
                        ${document.body.classList.contains('is-admin') ? `<button onclick="deleteAd('${d.id}')" class="absolute top-2 left-2 bg-red-600 text-white p-1 rounded-full text-[8px] z-10">✕ حذف</button>` : ''}
                        <img src="${d.data().img}">
                    </div>`;
                });
            });
        }

        window.uploadAd = async () => {
            if(!base64Img) return;
            await addDoc(window.dbAds, { img: base64Img, time: Date.now() });
            alert("تم نشر الإعلان"); location.reload();
        };

        window.deleteAd = async (id) => { if(confirm("حذف الإعلان؟")) await deleteDoc(doc(window.dbDirect, "ads", id)); };

        window.uploadProduct = async () => {
            const n = document.getElementById('addName').value; const p = document.getElementById('addPrice').value;
            const id = document.getElementById('addId').value; const c = document.getElementById('addCat').value || "عام";
            if(n && p) { await addDoc(window.dbCol, { name: n, price: Number(p), code: id, cat: c, img: base64Img, time: Date.now() }); location.reload(); }
        };

        function loadProducts() {
            onSnapshot(query(window.dbCol, orderBy("time", "desc")), (snap) => {
                const grid = document.getElementById('itemsGrid'); grid.innerHTML = '';
                const groups = {};
                snap.forEach(d => { const itm = d.data(); if(!groups[itm.cat]) groups[itm.cat] = []; groups[itm.cat].push({id: d.id, ...itm}); });

                for(const cat in groups) {
                    let html = `<div class="category-header animate-item">${cat}</div><div class="grid grid-cols-2 gap-4">`;
                    groups[cat].forEach(item => {
                        html += `<div class="card p-4 flex flex-col shadow-sm animate-item">
                            <div class="admin-only absolute top-2 right-2 flex gap-1 z-10">
                                <button onclick="editName('${item.id}', '${item.name}')" class="bg-blue-500 text-white w-7 h-7 rounded-lg text-[10px]">📝</button>
                                <button onclick="deleteItem('${item.id}')" class="bg-red-500 text-white w-7 h-7 rounded-lg text-[10px]">✕</button>
                            </div>
                            <img src="${item.img || 'https://placehold.co/200'}" class="w-full h-24 object-contain mb-3 rounded-xl">
                            <h2 class="text-[10px] font-black h-8 overflow-hidden text-slate-700">${item.name}</h2>
                            <p class="text-maroon font-black text-sm my-2 flex items-center gap-1">
                                <span>${item.price.toLocaleString()} د.ع</span>
                                <button onclick="editPrice('${item.id}', ${item.price})" class="admin-only text-slate-400 text-[10px]">📝</button>
                            </p>
                            <div class="flex items-center justify-between bg-slate-100 p-1 rounded-xl mb-2">
                                <button onclick="changeQty('${item.id}', -1)" class="w-8 h-8 font-bold">-</button>
                                <span id="qty-${item.id}" class="text-xs font-black">1</span>
                                <button onclick="changeQty('${item.id}', 1)" class="w-8 h-8 font-bold">+</button>
                            </div>
                            <button onclick="addToCart('${item.id}', '${item.name}', ${item.price}, '${item.code}')" class="bg-[#0f172a] text-white py-3 rounded-xl text-[9px] font-black active:scale-95 transition-all">إضافة للسلة</button>
                        </div>`;
                    });
                    grid.innerHTML += html + `</div>`;
                }
            });
        }

        window.editPrice = async (id, old) => { const n = prompt("السعر الجديد:", old); if(n) await updateDoc(doc(window.dbDirect, "products", id), { price: Number(n) }); };
        window.editName = async (id, old) => { const n = prompt("الاسم الجديد:", old); if(n) await updateDoc(doc(window.dbDirect, "products", id), { name: n }); };
        window.deleteItem = async (id) => { if(confirm("حذف؟")) await deleteDoc(doc(window.dbDirect, "products", id)); };
        window.changeQty = (id, v) => { let el = document.getElementById(`qty-${id}`); let n = parseInt(el.innerText) + v; if(n >= 1) el.innerText = n; };

        window.addToCart = (id, name, price, code) => {
            const qty = parseInt(document.getElementById(`qty-${id}`).innerText);
            const exist = cart.find(i => i.id === id);
            if(exist) exist.qty += qty; else cart.push({id, name, price, code, qty});
            document.getElementById('cartBar').style.display = 'flex';
            document.getElementById('cartCount').innerText = cart.length + " مواد بالسلة";
            document.getElementById('totalPriceDisplay').innerText = cart.reduce((s, i) => s + (i.price * i.qty), 0).toLocaleString() + " د.ع";
        };

        window.showCart = () => {
            const list = document.getElementById('cartList'); list.innerHTML = '';
            cart.forEach(i => { list.innerHTML += `<div class="flex justify-between bg-slate-50 p-3 rounded-2xl border text-[10px] font-bold"><div>${i.name}</div><div class="text-maroon">${(i.price * i.qty).toLocaleString()} د.ع</div></div>`; });
            document.getElementById('cartModal').classList.remove('hidden');
        };

        window.sendWhatsApp = (phone) => {
            const loc = document.getElementById('customerLocation').value; if(!loc) return alert("اكتب اسم المحل");
            let total = 0, msg = `🧾 *فاتورة طلبية hoco. Elite*\n📍 *المحل:* ${loc}\n--------------------------\n`;
            cart.forEach((i, idx) => { let sub = i.price * i.qty; total += sub; msg += `*${idx+1}.* ${i.name}\n🔢 العدد: ${i.qty} | السعر: ${sub.toLocaleString()} د.ع\n🏷️ الكود: ${i.code}\n--------------------------\n`; });
            msg += `💰 *المجموع الكلي: ${total.toLocaleString()} د.ع*`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`);
        };
    </script>
</body>
</html>
