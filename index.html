<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>hoco. Elite Pro System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAqqQ9j34XDw1_CvfWfuX_VTM66Y6C1C0SRHYJ", 
            authDomain: "hocoprice.firebaseapp.com",
            projectId: "hocoprice",
            storageBucket: "hocoprice.firebasestorage.app",
            messagingSenderId: "367105764415",
            appId: "1:367105764415:web:c2e2d7cb06fa489114757c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.dbCol = collection(db, "products");
        window.dbAds = collection(db, "ads");
        window.dbDirect = db;
    </script>

    <style>
        :root { --primary: #0f172a; --maroon: #800000; --bg: #f8fafc; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--primary); -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-item { animation: fadeInUp 0.4s ease forwards; }

        @keyframes fadeOut { 0% { opacity: 1; visibility: visible; } 80% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
        #welcomeMsg { animation: fadeOut 4s forwards; }

        .card { background: white; border-radius: 20px; border: 1px solid #f1f5f9; position: relative; overflow: hidden; transition: 0.2s; }
        .card:active { transform: scale(0.98); }

        .badge { position: absolute; top: 10px; right: -30px; padding: 4px 35px; transform: rotate(45deg); font-size: 8px; font-weight: 900; color: white; z-index: 5; }
        .badge-hot { background: linear-gradient(to right, #ef4444, #b91c1c); }
        .badge-offer { background: linear-gradient(to right, #10b981, #047857); }

        .admin-controls { display: none; position: absolute; top: 8px; left: 8px; z-index: 20; gap: 4px; }
        .is-admin .admin-controls { display: flex; }
        .is-admin .admin-only { display: inline-block; }
        .admin-only { display: none; }
        
        .category-header { background: #0f172a; color: white; padding: 8px 18px; border-radius: 12px; font-size: 13px; font-weight: 900; margin: 25px 0 12px 0; display: inline-block; }
        
        .ads-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px; padding: 10px 5px; scrollbar-width: none; }
        .ads-slider::-webkit-scrollbar { display: none; }
        .ad-card { flex: 0 0 92%; scroll-snap-align: center; border-radius: 25px; height: 160px; overflow: hidden; position: relative; box-shadow: 0 10px 20px -10px rgba(0,0,0,0.2); }
        .ad-card img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body class="pb-40 px-2">

    <div id="welcomeMsg" class="fixed inset-0 z-[200] flex items-center justify-center p-6 bg-[#0f172a]/90 backdrop-blur-lg text-center hidden">
        <div class="animate-item">
            <div class="text-6xl mb-4">🇮🇶</div>
            <h2 class="text-white text-2xl font-black mb-2">أهلاً بك في hoco. Iraq</h2>
            <p class="text-slate-300 text-sm leading-relaxed">
                كل تفصيله بهالنظام معمولة بحب حتى تختصر عليكم الوقت والتعب ..<br>
                <span class="text-amber-400 font-bold mt-2 block">فريق مبيعات Hoco Iraq 🇮🇶</span>
            </p>
        </div>
    </div>

    <div id="loginScreen" class="fixed inset-0 z-[100] bg-[#0f172a] flex flex-col items-center justify-center p-8">
        <h1 class="text-5xl font-black text-white italic mb-10 tracking-tighter text-center">hoco.<br><span class="text-lg not-italic font-light tracking-normal text-slate-400">Elite Pro System</span></h1>
        <div class="w-full max-w-xs space-y-4">
            <input type="password" id="passInput" placeholder="ادخل الرمز" class="w-full p-5 rounded-3xl text-center text-lg font-bold bg-white/10 border border-white/20 text-white outline-none">
            <button onclick="checkLogin()" class="w-full bg-white text-[#0f172a] py-5 rounded-3xl font-black shadow-2xl active:scale-95 transition-all">فتح النظام</button>
        </div>
    </div>

    <div id="mainContent" class="hidden">
        <header class="bg-white/90 backdrop-blur-md sticky top-0 z-50 p-4 border-b flex justify-between items-center -mx-2 shadow-sm">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-maroon rounded-lg flex items-center justify-center text-white font-black italic">h</div>
                <h1 class="text-2xl font-black text-maroon italic tracking-tighter">hoco.</h1>
            </div>
            <div class="flex gap-2">
                <button id="adminBtn" onclick="document.getElementById('adminUI').classList.toggle('hidden')" class="hidden bg-slate-100 p-2 rounded-xl text-[10px] font-bold">إدارة +</button>
                <button onclick="location.reload()" class="bg-rose-50 text-rose-600 px-4 py-2 rounded-xl text-[10px] font-bold">خروج</button>
            </div>
        </header>

        <div id="adminUI" class="hidden m-2 p-6 bg-white rounded-[30px] shadow-2xl border-2 border-blue-50">
            <div class="flex border-b mb-4">
                <button onclick="switchTab('prod')" class="flex-1 pb-2 font-bold text-xs text-blue-600 border-b-2 border-blue-600">منتجات</button>
                <button onclick="switchTab('ads')" class="flex-1 pb-2 font-bold text-xs text-slate-400">إعلانات</button>
            </div>
            <div id="prodTab" class="space-y-3">
                <select id="addBadge" class="w-full p-4 rounded-2xl bg-slate-50 border text-sm font-bold outline-none"><option value="">بدون ملصق</option><option value="hot">HOT SALE 🔥</option><option value="offer">عرض خاص 🎁</option></select>
                <input type="text" id="addCat" placeholder="الصنف (مثلاً: شواحن)" class="w-full p-4 rounded-2xl bg-slate-50 border outline-none text-sm font-bold">
                <input type="text" id="addName" placeholder="اسم المنتج" class="w-full p-4 rounded-2xl bg-slate-50 border outline-none text-sm font-bold">
                <div class="grid grid-cols-2 gap-2"><input type="number" id="addPrice" placeholder="السعر" class="p-4 rounded-2xl bg-slate-50 border outline-none text-sm font-bold"><input type="text" id="addId" placeholder="الكود" class="p-4 rounded-2xl bg-slate-50 border outline-none text-sm font-bold"></div>
                <button onclick="document.getElementById('fileImg').click()" class="w-full p-4 rounded-2xl bg-blue-50 border-2 border-dashed border-blue-200 text-blue-600 font-bold text-[10px]">📸 اختر صورة المنتج</button>
                <input type="file" id="fileImg" accept="image/*" class="hidden" onchange="previewImage(this, 'imgPreview')">
                <img id="imgPreview" class="hidden w-20 h-20 mx-auto rounded-xl object-cover border">
                <button id="saveBtn" onclick="uploadProduct()" class="w-full bg-[#0f172a] text-white py-4 rounded-2xl font-black">حفظ المنتج</button>
            </div>
            <div id="adsTab" class="hidden space-y-3">
                <button onclick="document.getElementById('fileAd').click()" class="w-full p-8 rounded-2xl bg-amber-50 border-2 border-dashed border-amber-200 text-amber-600 font-bold text-xs">🖼️ اختر صورة الإعلان</button>
                <input type="file" id="fileAd" accept="image/*" class="hidden" onchange="previewImage(this, 'adPreview')">
                <img id="adPreview" class="hidden w-full h-32 rounded-xl object-cover border">
                <button onclick="uploadAd()" class="w-full bg-amber-500 text-white py-4 rounded-2xl font-black">نشر الإعلان</button>
            </div>
        </div>

        <div class="px-2 mt-4"><div class="relative"><input type="text" id="searchInput" oninput="filterProducts()" placeholder="ابحث عن مادة أو كود..." class="w-full p-4 pr-12 rounded-2xl bg-white border border-slate-200 shadow-sm outline-none text-sm font-bold focus:border-maroon transition-all"><span class="absolute right-4 top-4 opacity-30">🔍</span></div></div>
        
        <div id="adsContainer" class="ads-slider mt-2"></div>
        
        <div id="itemsGrid" class="p-2 pb-10"></div>

        <footer class="mt-10 py-10 border-t border-slate-100 text-center">
            <p class="text-[10px] font-bold text-slate-300 tracking-widest uppercase italic">
                صمم بواسطة فريق مبيعات Hoco 🇮🇶
            </p>
        </footer>
    </div>

    <div id="cartBar" style="display: none;" class="fixed bottom-6 left-4 right-4 bg-[#0f172a] text-white p-5 rounded-[25px] shadow-2xl z-50 flex justify-between items-center max-w-lg mx-auto">
        <div class="flex flex-col"><span id="cartCount" class="font-black text-sm text-yellow-400">0 مواد</span><span id="totalPriceDisplay" class="text-[10px] text-white/50">المجموع: 0 د.ع</span></div>
        <button onclick="showCart()" class="bg-maroon text-white px-8 py-3.5 rounded-2xl text-xs font-black">عرض الطلبية</button>
    </div>

    <div id="cartModal" class="fixed inset-0 bg-slate-900/95 backdrop-blur-md z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-[40px] w-full max-w-md p-8 shadow-2xl flex flex-col max-h-[90vh]">
            <h2 class="text-xl font-black text-center mb-6 italic">تفاصيل الطلبية</h2>
            <div id="cartList" class="flex-1 overflow-y-auto space-y-3 mb-6 pr-2"></div>
            <input type="text" id="customerLocation" placeholder="اكتب اسم المحل أو العنوان..." class="w-full p-4 rounded-2xl bg-yellow-50 border border-yellow-200 mb-4 text-center text-sm font-bold outline-none">
            <div class="grid grid-cols-2 gap-2">
                <button onclick="sendWhatsApp('9647870037165')" class="bg-[#25D366] text-white p-4 rounded-2xl text-[10px] font-black shadow-md">ودوود</button>
                <button onclick="sendWhatsApp('9647737774427')" class="bg-[#25D366] text-white p-4 rounded-2xl text-[10px] font-black shadow-md">سمر</button>
                <button onclick="sendWhatsApp('9647722897766')" class="bg-[#25D366] text-white p-4 rounded-2xl text-[10px] font-black shadow-md">غادة</button>
                <button onclick="sendWhatsApp('9647870037167')" class="bg-[#25D366] text-white p-4 rounded-2xl text-[10px] font-black shadow-md">مينا</button>
            </div>
            <button onclick="document.getElementById('cartModal').classList.add('hidden')" class="mt-4 text-slate-400 text-[10px] font-bold">إغلاق</button>
        </div>
    </div>

    <script type="module">
        import { addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let cart = [];
        let base64Img = "";
        let allProducts = [];

        window.switchTab = (tab) => {
            const p = document.getElementById('prodTab'); const a = document.getElementById('adsTab');
            if(tab === 'prod') { p.classList.remove('hidden'); a.classList.add('hidden'); }
            else { a.classList.remove('hidden'); p.classList.add('hidden'); }
        };

        window.previewImage = (input, targetId) => {
            const reader = new FileReader();
            reader.onload = (e) => { base64Img = e.target.result; const prev = document.getElementById(targetId); prev.src = base64Img; prev.classList.remove('hidden'); };
            reader.readAsDataURL(input.files[0]);
        };

        window.checkLogin = () => {
            const pass = document.getElementById('passInput').value;
            if(pass === "1234") { document.body.classList.add('is-admin'); document.getElementById('adminBtn').classList.remove('hidden'); startApp(); }
            else if(pass === "5555") { startApp(); } else { alert("رمز خطأ"); }
        };

        function startApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('welcomeMsg').classList.remove('hidden');
            loadData();
        }

        window.uploadProduct = async () => {
            const b = document.getElementById('addBadge').value; const c = document.getElementById('addCat').value || "عام";
            const n = document.getElementById('addName').value; const p = Number(document.getElementById('addPrice').value);
            const id = document.getElementById('addId').value;
            if(n && p) {
                await addDoc(window.dbCol, { badge: b, cat: c, name: n, price: p, code: id, img: base64Img, time: Date.now() });
                location.reload();
            }
        };

        window.updatePrice = async (id, oldPrice) => {
            const newPrice = prompt("أدخل السعر الجديد:", oldPrice);
            if(newPrice && !isNaN(newPrice)) {
                await updateDoc(doc(window.dbDirect, "products", id), { price: Number(newPrice) });
            }
        };

        window.uploadAd = async () => {
            if(!base64Img) return;
            await addDoc(window.dbAds, { img: base64Img, time: Date.now() });
            alert("تم نشر الإعلان"); location.reload();
        };

        window.removeAd = async (id) => { if(confirm("حذف الإعلان؟")) await deleteDoc(doc(window.dbDirect, "ads", id)); };
        window.removeItem = async (id) => { if(confirm("حذف المنتج؟")) await deleteDoc(doc(window.dbDirect, "products", id)); };

        function loadData() {
            onSnapshot(query(window.dbAds, orderBy("time", "desc")), (snap) => {
                const cont = document.getElementById('adsContainer'); cont.innerHTML = '';
                snap.forEach(d => {
                    const ad = d.data();
                    const adEl = document.createElement('div');
                    adEl.className = 'ad-card shadow-lg animate-item';
                    adEl.innerHTML = `
                        ${document.body.classList.contains('is-admin') ? `<button onclick="removeAd('${d.id}')" class="absolute top-2 left-2 bg-red-600 text-white p-1 rounded-full text-[8px] z-10">✕ حذف</button>` : ''}
                        <img src="${ad.img}">
                    `;
                    cont.appendChild(adEl);
                });
            });

            onSnapshot(query(window.dbCol, orderBy("time", "desc")), (snap) => {
                allProducts = [];
                snap.forEach(d => allProducts.push({id: d.id, ...d.data()}));
                renderUI(allProducts);
            });
        }

        window.filterProducts = () => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(term) || p.code.toLowerCase().includes(term));
            renderUI(filtered);
        };

        function renderUI(data) {
            const grid = document.getElementById('itemsGrid'); grid.innerHTML = '';
            const groups = {};
            data.forEach(itm => { if(!groups[itm.cat]) groups[itm.cat] = []; groups[itm.cat].push(itm); });

            for(const cat in groups) {
                let html = `<div class="category-header animate-item">${cat}</div><div class="grid grid-cols-2 gap-3">`;
                groups[cat].forEach(item => {
                    let badge = item.badge === "hot" ? `<div class="badge badge-hot">HOT</div>` : item.badge === "offer" ? `<div class="badge badge-offer">OFFER</div>` : "";
                    html += `<div class="card p-3 flex flex-col shadow-sm animate-item">
                        ${badge}
                        <div class="admin-controls"><button onclick="removeItem('${item.id}')" class="bg-red-500 text-white w-7 h-7 rounded-lg text-[10px]">✕</button></div>
                        <img src="${item.img || 'https://placehold.co/200'}" class="w-full h-28 object-contain mb-2 rounded-xl bg-slate-50">
                        <h2 class="text-[10px] font-bold h-8 overflow-hidden leading-tight text-slate-700">${item.name}</h2>
                        <p class="text-maroon font-black text-xs my-2 flex items-center gap-1">
                           <span>${item.price.toLocaleString()} د.ع</span>
                           <button onclick="updatePrice('${item.id}', ${item.price})" class="admin-only text-slate-400 text-[10px]">📝</button>
                        </p>
                        <div class="flex items-center justify-between bg-slate-50 p-1 rounded-xl mb-2 border border-slate-100">
                            <button onclick="changeQty('${item.id}', -1)" class="w-8 h-8 font-bold text-slate-400">-</button>
                            <span id="qty-${item.id}" class="text-xs font-black">1</span>
                            <button onclick="changeQty('${item.id}', 1)" class="w-8 h-8 font-bold text-primary">+</button>
                        </div>
                        <button onclick="addToCart('${item.id}', '${item.name}', ${item.price}, '${item.code}')" class="bg-[#0f172a] text-white py-3 rounded-xl text-[9px] font-black active:scale-95 transition-all">إضافة للسلة</button>
                    </div>`;
                });
                grid.innerHTML += html + `</div>`;
            }
        }

        window.changeQty = (id, v) => { let el = document.getElementById(`qty-${id}`); let n = parseInt(el.innerText) + v; if(n >= 1) el.innerText = n; };

        window.addToCart = (id, name, price, code) => {
            const qty = parseInt(document.getElementById(`qty-${id}`).innerText);
            const exist = cart.find(i => i.id === id);
            if(exist) exist.qty += qty; else cart.push({id, name, price, code, qty});
            document.getElementById('cartBar').style.display = 'flex';
            document.getElementById('cartCount').innerText = cart.length + " مواد بالسلة";
            let total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            document.getElementById('totalPriceDisplay').innerText = "المجموع: " + total.toLocaleString() + " د.ع";
        };

        window.showCart = () => {
            const list = document.getElementById('cartList'); list.innerHTML = '';
            cart.forEach(i => { list.innerHTML += `<div class="flex justify-between bg-slate-50 p-4 rounded-2xl border text-[10px] font-bold"><div>${i.name}<br><span class="text-[8px] opacity-50">ID: ${i.code}</span></div><div class="text-left text-maroon">${(i.price * i.qty).toLocaleString()} د.ع<br><span class="text-black opacity-50">العدد: ${i.qty}</span></div></div>`; });
            document.getElementById('cartModal').classList.remove('hidden');
        };

        window.sendWhatsApp = (phone) => {
            const loc = document.getElementById('customerLocation').value;
            if(!loc) return alert("اكتب اسم المحل أولاً");
            let total = 0;
            let msg = `*🧾 فاتورة طلبية hoco. Elite*\n*🏛️ المحل:* ${loc}\n--------------------------\n\n`;
            cart.forEach((i, idx) => {
                let sub = i.price * i.qty; total += sub;
                msg += `*${idx + 1}. [ ${i.name} ]*\n   - الكود: ${i.code}\n   - العدد: ${i.qty} | المجموع: ${sub.toLocaleString()} د.ع\n--------------------------\n`;
            });
            msg += `\n*💰 المجموع الكلي: [ ${total.toLocaleString()} د.ع ]*`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`);
        };
    </script>
</body>
</html>
