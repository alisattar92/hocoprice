<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>hoco. Elite Ultra Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAqqQ9j34XDw1_CvfWfuX_VTM66Y6C1C0SRHYJ", 
            authDomain: "hocoprice.firebaseapp.com",
            projectId: "hocoprice",
            appId: "1:367105764415:web:c2e2d7cb06fa489114757c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.dbCol = collection(db, "products");
        window.dbDirect = db;
        window.writeBatch = writeBatch;
    </script>

    <style>
        :root { --navy: #0f172a; --gold: #d4af37; }
        body { font-family: 'Tajawal', sans-serif; background: #f1f5f9; color: var(--navy); overflow-x: hidden; }
        .admin-only { display: none !important; }
        .is-admin .admin-only { display: flex !important; }
        .glass-dark { background: #0f172a; }
        .input-elegant { background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 10px; outline: none; transition: 0.3s; }
        #progressCont { display: none; width: 100%; background: #334155; height: 10px; border-radius: 10px; overflow: hidden; margin: 15px 0; }
        #progressBar { width: 0%; height: 100%; background: var(--gold); }
        .btn-gold-solid { background: var(--gold); color: #0f172a; font-weight: 900; }
        .btn-navy-solid { background: var(--navy); color: white; font-weight: 900; }
    </style>
</head>
<body class="pb-24">

    <div id="loginScreen" class="fixed inset-0 z-[200] glass-dark flex flex-col items-center justify-center p-8 text-center">
        <div class="mb-10"><h1 class="text-6xl font-black text-[#d4af37] italic tracking-tighter text-shadow-xl">hoco.</h1></div>
        <div class="w-full max-w-xs space-y-4">
            <input type="password" id="passInput" placeholder="أدخل رمز المرور" class="w-full p-5 rounded-2xl text-center text-xl font-bold bg-white/10 border border-white/20 text-white outline-none">
            <button onclick="checkLogin()" class="w-full btn-gold-solid py-5 rounded-2xl text-lg shadow-2xl">دخول النظام</button>
        </div>
    </div>

    <header class="sticky top-0 z-50 bg-white border-b p-4 flex justify-between items-center shadow-sm">
        <button onclick="document.getElementById('adminPanel').classList.toggle('hidden')" class="admin-only btn-navy-solid px-4 py-2 rounded-xl text-[10px]">⚙️ لوحة التحكم</button>
        <h1 class="text-2xl font-black italic tracking-tighter text-navy">hoco.</h1>
        <button onclick="location.reload()" class="text-red-500 font-bold text-[10px]">خروج</button>
    </header>

    <div id="adminPanel" class="hidden m-4 space-y-4 max-w-2xl mx-auto bg-white p-6 rounded-[2.5rem] shadow-xl border">
        <div class="bg-navy p-6 rounded-3xl text-white">
            <h3 class="text-gold font-black text-sm mb-4">رفع وتحديث من برنامج الأمين</h3>
            <input type="file" id="excelFile" class="hidden" onchange="syncExcel(this)">
            <button onclick="document.getElementById('excelFile').click()" class="w-full py-4 btn-gold-solid rounded-xl text-xs">رفع ملف الإكسل الآن 📊</button>
            <div id="progressCont"><div id="progressBar"></div></div>
            <p id="statusMsg" class="text-[10px] mt-2 text-white/50 text-center"></p>
        </div>

        <div class="grid grid-cols-2 gap-3 p-4 bg-slate-50 rounded-3xl border">
            <select id="bulkCatSelect" class="input-elegant text-xs font-bold col-span-1"></select>
            <button onclick="executeBulkMove()" class="bg-blue-600 text-white rounded-xl font-bold text-xs col-span-1">نقل المحدد لهذه المجموعة</button>
        </div>

        <div class="p-4 bg-slate-50 rounded-3xl border">
            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="mName" placeholder="اسم المنتج" class="input-elegant text-xs">
                <input type="text" id="mCode" placeholder="الكود" class="input-elegant text-xs">
                <input type="number" id="mPrice" placeholder="السعر" class="input-elegant text-xs">
                <input type="text" id="mCat" placeholder="المجموعة" class="input-elegant text-xs">
                <button onclick="manualAdd()" class="col-span-2 btn-navy-solid py-3 rounded-xl text-xs">إضافة منتج جديد يدوياً</button>
            </div>
        </div>
    </div>

    <main class="p-4 max-w-5xl mx-auto">
        <div class="mb-6"><input type="text" id="search" oninput="doSearch()" placeholder="بحث في المنتجات..." class="w-full p-5 rounded-2xl bg-white shadow-md font-bold border-none outline-none focus:ring-2 ring-gold"></div>
        <div id="tabs" class="flex gap-2 overflow-x-auto no-scrollbar mb-6"></div>
        <div id="grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </main>

    <div id="cartBar" style="display:none;" class="fixed bottom-6 left-4 right-4 bg-navy text-white p-5 rounded-[2rem] shadow-2xl flex justify-between items-center z-[100] max-w-lg mx-auto">
        <div><p id="cCount" class="font-black text-lg text-white">0 مادة</p><p id="cTotal" class="text-gold text-[10px] font-bold">0 IQD</p></div>
        <button onclick="showCart()" class="btn-gold-solid px-10 py-4 rounded-xl text-xs">إتمام الطلب ✅</button>
    </div>

    <div id="cartModal" class="fixed inset-0 z-[150] bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 max-h-[90vh] overflow-y-auto">
            <h2 class="text-2xl font-black mb-6 text-navy">تأكيد محتويات السلة</h2>
            <div id="cartItems" class="space-y-3 mb-8"></div>
            <div class="space-y-3 mb-6">
                <input type="text" id="custName" placeholder="اسم الزبون / المحل" class="w-full input-elegant font-bold">
                <div class="flex gap-2">
                    <input type="text" id="custLoc" placeholder="الموقع الجغرافي" class="flex-1 input-elegant text-[10px]">
                    <button onclick="getLoc()" class="btn-navy-solid px-5 rounded-xl">📍</button>
                </div>
                <input type="text" id="custPoint" placeholder="نقطة دالة" class="w-full input-elegant font-bold">
            </div>
            
            <p class="text-[10px] font-bold mb-2 text-slate-400">إرسال الطلب عبر واتساب إلى:</p>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="sendOrder('9647870037165', 'ودود')" class="bg-green-600 text-white p-4 rounded-xl font-bold text-[10px]">ودود</button>
                <button onclick="sendOrder('9647737774427', 'سمر')" class="bg-green-600 text-white p-4 rounded-xl font-bold text-[10px]">سمر</button>
                <button onclick="sendOrder('9647722897766', 'غادة')" class="bg-green-600 text-white p-4 rounded-xl font-bold text-[10px]">غادة</button>
                <button onclick="sendOrder('9647870037167', 'اية')" class="bg-green-600 text-white p-4 rounded-xl font-bold text-[10px]">اية</button>
                <button onclick="sendOrder('9647704793024', 'الحسابات')" class="bg-green-600 text-white p-4 rounded-xl font-bold text-[10px]">الحسابات</button>
            </div>
            <button onclick="document.getElementById('cartModal').classList.add('hidden')" class="w-full mt-6 text-slate-400 font-bold text-[10px]">إلغاء وإغلاق</button>
        </div>
    </div>

    <script type="module">
        import { doc, getDocs, deleteDoc, updateDoc, addDoc, onSnapshot, query, orderBy, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let products = [];
        let cart = [];
        let selected = new Set();

        window.checkLogin = () => {
            const p = document.getElementById('passInput').value;
            if(p === "1024") { document.body.classList.add('is-admin'); finalizeLogin(); }
            else if(p === "1234") { finalizeLogin(); }
            else alert("الرمز خاطئ");
        };

        function finalizeLogin() {
            document.getElementById('loginScreen').style.display = 'none';
            onSnapshot(query(window.dbCol, orderBy("time", "desc")), (snap) => {
                products = [];
                snap.forEach(d => products.push({id: d.id, ...d.data()}));
                renderTabs();
                renderGrid(products);
                updateBulkSelect();
            });
        }

        function renderTabs() {
            const cats = ["الكل", ...new Set(products.map(p => p.cat))];
            document.getElementById('tabs').innerHTML = cats.map(c => `
                <button onclick="filterCat('${c}')" class="px-6 py-2 bg-white rounded-full shadow-sm text-[10px] font-bold whitespace-nowrap border-2 border-transparent hover:border-gold">${c}</button>
            `).join('');
        }

        function updateBulkSelect() {
            const cats = [...new Set(products.map(p => p.cat))];
            document.getElementById('bulkCatSelect').innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        window.renderGrid = (data) => {
            const g = document.getElementById('grid');
            g.innerHTML = data.map(p => `
                <div class="bg-white p-4 rounded-[2rem] shadow-sm border border-transparent flex flex-col relative">
                    <div class="admin-only absolute top-3 left-3 z-10"><input type="checkbox" onchange="toggleSelect('${p.id}')" class="w-5 h-5"></div>
                    <div class="admin-only absolute top-3 right-3 z-10 flex flex-col gap-1">
                        <button onclick="quickEdit('${p.id}', 'name')" class="bg-white p-1 rounded border text-[7px] font-bold shadow-sm">اسم ✏️</button>
                        <button onclick="quickEdit('${p.id}', 'price')" class="bg-white p-1 rounded border text-[7px] font-bold shadow-sm">سعر 💰</button>
                        <button onclick="quickEdit('${p.id}', 'img')" class="bg-white p-1 rounded border text-[7px] font-bold shadow-sm">صورة 📷</button>
                        <button onclick="deleteItem('${p.id}')" class="bg-red-50 p-1 rounded border text-red-500 text-[7px] font-bold shadow-sm">حذف</button>
                    </div>
                    <div class="h-28 mb-3 flex items-center justify-center cursor-pointer" onclick="quickEdit('${p.id}', 'img')"><img src="${p.img || 'https://placehold.co/200?text=hoco'}" class="max-h-full object-contain"></div>
                    <h3 class="text-[9px] font-black h-8 line-clamp-2 mb-1">${p.name}</h3>
                    <p class="text-gold font-black text-[11px] mb-3">${p.price.toLocaleString()} IQD</p>
                    <div class="mt-auto flex flex-col gap-2">
                        <input type="number" id="qty-${p.id}" value="1" min="1" class="w-full p-2 bg-slate-50 rounded-xl text-center text-xs font-black outline-none border">
                        <button onclick="addToCart('${p.id}')" class="btn-gold-solid py-3 rounded-xl text-[10px]">إضافة للسلة</button>
                    </div>
                </div>
            `).join('');
        };

        window.syncExcel = async (input) => {
            const file = input.files[0];
            const reader = new FileReader();
            document.getElementById('progressCont').style.display = 'block';
            reader.onload = async (e) => {
                const data = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
                const sheet = XLSX.utils.sheet_to_json(data.Sheets[data.SheetNames[0]]);
                let current = 0;
                for(const row of sheet) {
                    const code = String(row["رمز المادة"] || "");
                    const d = { name: row["اسم المادة"], price: Number(row["السعر"]), stock: Number(row["الكمية"]), cat: row["المجموعة"] || "عام", time: Date.now() };
                    const exist = products.find(p => String(p.code) === code);
                    if(exist) await updateDoc(doc(window.dbDirect, "products", exist.id), d);
                    else if(code) await addDoc(window.dbCol, { ...d, code, img: "" });
                    current++;
                    document.getElementById('progressBar').style.width = Math.round((current / sheet.length) * 100) + '%';
                    document.getElementById('statusMsg').innerText = `جاري الرفع: ${current} من ${sheet.length}`;
                }
                alert("تم تحديث البيانات بنجاح ✅"); location.reload();
            };
            reader.readAsArrayBuffer(file);
        };

        window.addToCart = (id) => {
            const qty = parseInt(document.getElementById(`qty-${id}`).value) || 1;
            const p = products.find(x => x.id === id);
            const exist = cart.find(x => x.id === id);
            if(exist) exist.qty += qty; else cart.push({...p, qty});
            updateCartUI();
        };

        function updateCartUI() {
            document.getElementById('cartBar').style.display = cart.length ? 'flex' : 'none';
            document.getElementById('cCount').innerText = `${cart.length} مادة`;
            document.getElementById('cTotal').innerText = `${cart.reduce((s,i)=>s+(i.price*i.qty),0).toLocaleString()} IQD`;
        }

        window.showCart = () => {
            document.getElementById('cartModal').classList.remove('hidden');
            document.getElementById('cartItems').innerHTML = cart.map((i, idx) => `
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border">
                    <div class="text-[9px] font-black">${i.name} (x${i.qty})</div>
                    <div class="text-gold font-bold text-[10px]">${(i.price*i.qty).toLocaleString()}</div>
                    <button onclick="cart.splice(${idx},1);updateCartUI();showCart();" class="text-red-500 font-bold px-2">✕</button>
                </div>
            `).join('');
        };

        window.sendOrder = (phone, emp) => {
            const n = document.getElementById('custName').value;
            if(!n) return alert("يرجى إدخال اسم الزبون");
            let msg = `🧾 *طلب hoco جديد*\n👤 *الزبون:* ${n}\n📍 *الموقع:* ${document.getElementById('custLoc').value}\n----------------\n`;
            cart.forEach(i => msg += `• ${i.name} (x${i.qty}) = ${(i.price*i.qty).toLocaleString()} IQD\n`);
            msg += `\n💵 *المجموع: ${cart.reduce((s,i)=>s+(i.price*i.qty),0).toLocaleString()} IQD*`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`);
            location.reload();
        };

        window.toggleSelect = (id) => selected.has(id) ? selected.delete(id) : selected.add(id);
        window.executeBulkMove = async () => {
            const target = document.getElementById('bulkCatSelect').value;
            if(selected.size === 0) return alert("حدد منتجات أولاً");
            const batch = window.writeBatch(window.dbDirect);
            selected.forEach(id => batch.update(doc(window.dbDirect, "products", id), { cat: target }));
            await batch.commit(); alert("تم النقل بنجاح ✅"); location.reload();
        };
        window.quickEdit = async (id, f) => {
            const p = products.find(x => x.id === id);
            if(f === 'img') {
                const i = document.createElement('input'); i.type = 'file';
                i.onchange = e => {
                    const r = new FileReader(); r.onload = async re => await updateDoc(doc(window.dbDirect, "products", id), { img: re.target.result });
                    r.readAsDataURL(e.target.files[0]);
                }; i.click();
            } else {
                const v = prompt(`تعديل ${f}:`, p[f]);
                if(v) await updateDoc(doc(window.dbDirect, "products", id), { [f]: f === 'price' ? Number(v) : v });
            }
        };
        window.filterCat = (c) => renderGrid(c === "الكل" ? products : products.filter(p => p.cat === c));
        window.doSearch = () => {
            const v = document.getElementById('search').value.toLowerCase();
            renderGrid(products.filter(p => p.name.toLowerCase().includes(v) || String(p.code).includes(v)));
        };
        window.manualAdd = async () => {
            const d = { name: document.getElementById('mName').value, code: document.getElementById('mCode').value, price: Number(document.getElementById('mPrice').value), cat: document.getElementById('mCat').value, time: Date.now(), img: "" };
            await addDoc(window.dbCol, d); alert("تمت الإضافة");
        };
        window.deleteItem = async (id) => { if(confirm("حذف؟")) await deleteDoc(doc(window.dbDirect, "products", id)); };
        window.getLoc = () => navigator.geolocation.getCurrentPosition(p => document.getElementById('custLoc').value = `https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`);
    </script>
</body>
</html>
