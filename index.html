<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>hoco. Elite Cloud System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAqqQ9j34XDw1_CvfWfuX_VTM66Y6C1C0SRHYJ", 
            authDomain: "hocoprice.firebaseapp.com",
            projectId: "hocoprice",
            storageBucket: "hocoprice.firebasestorage.app",
            messagingSenderId: "367105764415",
            appId: "1:367105764415:web:c2e2d7cb06fa489114757c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.dbCol = collection(db, "products");
        window.dbDirect = db;
    </script>

    <style>
        :root { --primary: #0f172a; --maroon: #800000; --bg: #f8fafc; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--primary); }
        .card { background: white; border-radius: 24px; transition: 0.3s; border: 1px solid #f1f5f9; }
        .admin-only { display: none; }
        .is-admin .admin-only { display: flex !important; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }
    </style>
</head>
<body class="pb-40">

    <div id="loginScreen" class="fixed inset-0 z-[100] bg-[#0f172a] flex flex-col items-center justify-center p-8">
        <h1 class="text-5xl font-black text-white italic mb-10 tracking-tighter">hoco.</h1>
        <div class="w-full max-w-xs space-y-4">
            <input type="password" id="passInput" placeholder="ادخل الرمز (آدمن أو زبون)" class="w-full p-5 rounded-3xl text-center text-lg font-bold bg-white/10 border border-white/20 text-white outline-none">
            <button onclick="checkLogin()" class="w-full bg-white text-[#0f172a] py-5 rounded-3xl font-black shadow-2xl active:scale-95 transition-all">دخول للنظام</button>
        </div>
    </div>

    <div id="mainContent" class="hidden">
        <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 p-4 border-b flex justify-between items-center">
            <h1 class="text-2xl font-black text-maroon italic">hoco. Elite</h1>
            <div class="flex gap-2">
                <button id="adminBtn" onclick="document.getElementById('adminUI').classList.toggle('hidden')" class="hidden bg-slate-100 p-2 rounded-xl text-[10px] font-bold">لوحة التحكم</button>
                <button onclick="location.reload()" class="bg-rose-50 text-rose-600 px-4 py-2 rounded-xl text-[10px] font-bold">خروج</button>
            </div>
        </header>

        <div id="adminUI" class="hidden m-4 p-6 bg-white rounded-[30px] shadow-xl border border-blue-100">
            <h3 class="text-xs font-black text-blue-500 mb-4 text-center">إضافة منتج جديد</h3>
            <div class="space-y-3">
                <input type="text" id="addName" placeholder="اسم المنتج" class="w-full p-4 rounded-2xl bg-slate-50 border outline-none text-sm font-bold">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="addId" placeholder="الكود" class="p-4 rounded-2xl bg-slate-50 border outline-none text-sm font-bold">
                    <input type="number" id="addPrice" placeholder="السعر (رقم فقط)" class="p-4 rounded-2xl bg-slate-50 border outline-none text-sm font-bold">
                </div>
                <input type="text" id="addImg" placeholder="رابط الصورة (URL)" class="w-full p-4 rounded-2xl bg-slate-50 border outline-none text-[10px] font-bold">
                <button onclick="uploadProduct()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg">حفظ في السحاب ☁️</button>
            </div>
        </div>

        <div id="itemsGrid" class="p-4 grid grid-cols-2 gap-4"></div>
    </div>

    <div id="cartBar" style="display: none;" class="fixed bottom-6 left-4 right-4 bg-[#0f172a] text-white p-5 rounded-[25px] shadow-2xl z-50 flex justify-between items-center max-w-lg mx-auto">
        <div class="flex flex-col">
            <span id="cartCount" class="font-black text-sm text-yellow-400">0 مواد</span>
            <span id="totalPriceDisplay" class="text-[10px] text-white/70">المجموع: 0 د.ع</span>
        </div>
        <button onclick="showCart()" class="bg-maroon text-white px-8 py-3.5 rounded-2xl text-xs font-black">إرسال الطلب</button>
    </div>

    <div id="cartModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[60] hidden flex items-end sm:items-center justify-center p-4">
        <div class="bg-white rounded-[40px] w-full max-w-md p-8 shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <h2 class="text-xl font-black text-center mb-6">تأكيد الطلبية</h2>
            
            <div id="cartList" class="flex-1 overflow-y-auto space-y-3 mb-6"></div>

            <div class="space-y-4">
                <input type="text" id="customerLocation" placeholder="اكتب عنوانك أو موقعك هنا..." class="w-full p-4 rounded-2xl bg-yellow-50 border-2 border-yellow-100 outline-none text-sm font-bold text-center">
                
                <p class="text-[9px] text-center font-bold text-slate-400 uppercase">ارسل الطلب إلى مندوبك</p>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="sendWhatsApp('9647737774427')" class="bg-[#25D366] text-white p-4 rounded-2xl text-[10px] font-black">سمر</button>
                    <button onclick="sendWhatsApp('9647722897766')" class="bg-[#25D366] text-white p-4 rounded-2xl text-[10px] font-black">غادة</button>
                    <button onclick="sendWhatsApp('9647870037165')" class="bg-[#25D366] text-white p-4 rounded-2xl text-[10px] font-black">ودوود</button>
                    <button onclick="sendWhatsApp('9647870037167')" class="bg-[#25D366] text-white p-4 rounded-2xl text-[10px] font-black">مينا</button>
                </div>
            </div>
            <button onclick="closeCart()" class="mt-4 text-slate-400 text-[10px] font-bold">إغلاق</button>
        </div>
    </div>

    <script type="module">
        import { addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let isAdminMode = false;
        let cart = [];

        window.checkLogin = () => {
            const pass = document.getElementById('passInput').value;
            if(pass === "1234") { 
                isAdminMode = true; 
                document.getElementById('adminBtn').classList.remove('hidden');
                document.body.classList.add('is-admin');
                startApp();
            } else if(pass === "5555") {
                startApp();
            } else { alert("الرمز غير صحيح"); }
        };

        function startApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            renderProducts();
        }

        window.uploadProduct = async () => {
            const n = document.getElementById('addName').value;
            const p = document.getElementById('addPrice').value;
            const id = document.getElementById('addId').value;
            const img = document.getElementById('addImg').value;
            if(n && p) {
                await addDoc(window.dbCol, { name: n, price: Number(p), code: id, img, time: Date.now() });
                alert("تم الحفظ!");
                document.getElementById('adminUI').classList.add('hidden');
            }
        };

        window.editPrice = async (id, oldPrice) => {
            const newPrice = prompt("ادخل السعر الجديد:", oldPrice);
            if(newPrice) {
                await updateDoc(doc(window.dbDirect, "products", id), { price: Number(newPrice) });
            }
        };

        window.deleteItem = async (id) => {
            if(confirm("حذف المنتج نهائياً؟")) await deleteDoc(doc(window.dbDirect, "products", id));
        };

        function renderProducts() {
            const q = query(window.dbCol, orderBy("time", "desc"));
            onSnapshot(q, (snap) => {
                const grid = document.getElementById('itemsGrid');
                grid.innerHTML = '';
                snap.forEach(d => {
                    const itm = d.data();
                    grid.innerHTML += `
                    <div class="card p-4 relative flex flex-col">
                        <div class="admin-only absolute top-2 right-2 flex gap-1">
                            <button onclick="editPrice('${d.id}', ${itm.price})" class="bg-blue-500 text-white w-7 h-7 rounded-lg text-xs shadow-lg">✎</button>
                            <button onclick="deleteItem('${d.id}')" class="bg-red-500 text-white w-7 h-7 rounded-lg text-xs shadow-lg">✕</button>
                        </div>
                        <img src="${itm.img || 'https://placehold.co/200/f1f5f9/0f172a?text=hoco.'}" class="w-full h-24 object-contain mb-3 rounded-xl">
                        <h2 class="text-[10px] font-black h-8 overflow-hidden">${itm.name}</h2>
                        <p class="text-maroon font-black text-sm my-2">${itm.price.toLocaleString()} د.ع</p>
                        
                        <div class="flex items-center justify-between bg-slate-100 p-1 rounded-xl mb-2">
                            <button onclick="changeQty('${d.id}', -1)" class="w-8 h-8 font-bold">-</button>
                            <span id="qty-${d.id}" class="text-xs font-black">1</span>
                            <button onclick="changeQty('${d.id}', 1)" class="w-8 h-8 font-bold">+</button>
                        </div>
                        <button onclick="addToCart('${d.id}', '${itm.name}', ${itm.price}, '${itm.code}')" class="bg-[#0f172a] text-white py-3 rounded-xl text-[9px] font-black active:scale-95 transition-all">إضافة للسلة</button>
                    </div>`;
                });
            });
        }

        window.changeQty = (id, val) => {
            let el = document.getElementById(`qty-${id}`);
            let v = parseInt(el.innerText) + val;
            if(v < 1) v = 1;
            el.innerText = v;
        };

        window.addToCart = (id, name, price, code) => {
            const qty = parseInt(document.getElementById(`qty-${id}`).innerText);
            const exist = cart.find(i => i.id === id);
            if(exist) exist.qty += qty; else cart.push({id, name, price, code, qty});
            
            updateCartUI();
            document.getElementById(`qty-${id}`).innerText = "1";
        };

        function updateCartUI() {
            const bar = document.getElementById('cartBar');
            if(cart.length > 0) {
                bar.style.display = 'flex';
                document.getElementById('cartCount').innerText = cart.length + " مواد مختارة";
                let total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
                document.getElementById('totalPriceDisplay').innerText = "المجموع: " + total.toLocaleString() + " د.ع";
            }
        }

        window.showCart = () => {
            const list = document.getElementById('cartList');
            list.innerHTML = '';
            cart.forEach(i => {
                list.innerHTML += `
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-2xl border border-slate-100">
                    <div><p class="text-[10px] font-bold">${i.name}</p><p class="text-[8px] text-slate-400">سعر القطعة: ${i.price.toLocaleString()}</p></div>
                    <div class="text-left"><p class="text-[10px] font-black text-maroon">${(i.price * i.qty).toLocaleString()} د.ع</p><p class="text-[9px] font-bold bg-slate-200 px-2 rounded-md italic">العدد: ${i.qty}</p></div>
                </div>`;
            });
            document.getElementById('cartModal').classList.remove('hidden');
        };

        window.sendWhatsApp = (phone) => {
            const loc = document.getElementById('customerLocation').value;
            if(!loc) { alert("يرجى كتابة عنوانك أو موقع السكن أولاً"); return; }
            
            let totalOrder = 0;
            let msg = `📦 *طلب جديد من hoco Elite:*\n`;
            msg += `📍 *الموقع:* ${loc}\n`;
            msg += `--------------------------\n`;
            
            cart.forEach((i, idx) => {
                const sub = i.price * i.qty;
                totalOrder += sub;
                msg += `*${idx+1}.* ${i.name}\n`;
                msg += `🔢 العدد: ${i.qty} | السعر: ${sub.toLocaleString()} د.ع\n`;
                msg += `🏷️ الكود: ${i.code}\n\n`;
            });

            msg += `--------------------------\n`;
            msg += `💰 *المجموع الكلي: ${totalOrder.toLocaleString()} د.ع*`;
            
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`);
        };

        window.closeCart = () => document.getElementById('cartModal').classList.add('hidden');
    </script>
</body>
</html>
